<script>
// ==========================================
// VARIABLE GLOBAL DATABASE MASTER
// ==========================================
let listMasterKategori = [];
let listMasterTindakan = [];
let listMasterObat = [];
let listMasterBmhp = [];
let listMasterUser = [];

// ==========================================
// INISIALISASI
// ==========================================
document.addEventListener("KlinikDataReady", () => {
   initDatabaseModule();
});

document.addEventListener("DOMContentLoaded", () => {
  setTimeout(() => {
     if(window.KlinikData && window.KlinikData.statusLoad && window.KlinikData.statusLoad.master) {
         initDatabaseModule();
     }
  }, 1000);
});

function initDatabaseModule() {
   // Fallback langsung dari window.KlinikData agar tidak kosong saat dibuka di Vercel / koneksi tertunda
   if (window.KlinikData) {
       if (listMasterTindakan.length === 0 && Array.isArray(window.KlinikData.tindakan) && window.KlinikData.tindakan.length > 0) {
           listMasterTindakan = window.KlinikData.tindakan.map(t => ({
               kode: t.kode || t.id,
               nama: t.nama,
               kategori: t.kategori || 'Umum',
               tarif: t.harga || t.tarif || 0,
               harga: t.harga || t.tarif || 0,
               perluLab: t.perluLab || 'Tidak'
           }));
           renderTabelTindakan();
       }
       if (listMasterObat.length === 0 && Array.isArray(window.KlinikData.obat) && window.KlinikData.obat.length > 0) {
           listMasterObat = window.KlinikData.obat;
           renderTabelObat();
           generateKodeObat();
       }
       if (listMasterBmhp.length === 0 && Array.isArray(window.KlinikData.bmhp) && window.KlinikData.bmhp.length > 0) {
           listMasterBmhp = window.KlinikData.bmhp;
           renderTabelBmhp();
           generateKodeBmhp();
       }
   }

   if (typeof google !== 'undefined' && google.script && google.script.run) {
       // Tarik Kategori (Untuk Dropdown Tindakan)
       google.script.run.withSuccessHandler(res => {
           if (res && res.length > 0) {
               listMasterKategori = res;
               populateKategoriDropdown();
           }
       }).getKategoriTindakan();

       // Tarik Daftar Tindakan (Untuk Tabel dan Acuan Kode)
       google.script.run.withSuccessHandler(res => {
           if (res && res.length > 0) {
               listMasterTindakan = res;
           } else if (window.KlinikData && Array.isArray(window.KlinikData.tindakan) && window.KlinikData.tindakan.length > 0) {
               listMasterTindakan = window.KlinikData.tindakan;
           }
           renderTabelTindakan();
       }).withFailureHandler(() => {
           if (window.KlinikData && Array.isArray(window.KlinikData.tindakan) && window.KlinikData.tindakan.length > 0) {
               listMasterTindakan = window.KlinikData.tindakan;
               renderTabelTindakan();
           }
       }).getDaftarTindakanLengkap();

       // Tarik Master Obat
       loadDaftarObatMaster();

       // Tarik Master BMHP
       loadDaftarBmhpMaster();
   }
}

function loadDaftarObatMaster() {
   if (listMasterObat.length === 0 && window.KlinikData && Array.isArray(window.KlinikData.obat) && window.KlinikData.obat.length > 0) {
       listMasterObat = window.KlinikData.obat;
       renderTabelObat();
       generateKodeObat();
   }
   if (typeof google !== 'undefined' && google.script && google.script.run) {
       google.script.run.withSuccessHandler(res => {
           if (res && res.length > 0) {
               listMasterObat = res;
           } else if (window.KlinikData && Array.isArray(window.KlinikData.obat) && window.KlinikData.obat.length > 0) {
               listMasterObat = window.KlinikData.obat;
           }
           renderTabelObat();
           generateKodeObat();
       }).withFailureHandler(() => {
           if (window.KlinikData && Array.isArray(window.KlinikData.obat) && window.KlinikData.obat.length > 0) {
               listMasterObat = window.KlinikData.obat;
               renderTabelObat();
               generateKodeObat();
           }
       }).getDaftarObatLengkap();
   }
}

function loadDaftarBmhpMaster() {
   if (listMasterBmhp.length === 0 && window.KlinikData && Array.isArray(window.KlinikData.bmhp) && window.KlinikData.bmhp.length > 0) {
       listMasterBmhp = window.KlinikData.bmhp;
       renderTabelBmhp();
       generateKodeBmhp();
   }
   if (typeof google !== 'undefined' && google.script && google.script.run) {
       google.script.run.withSuccessHandler(res => {
           if (res && res.length > 0) {
               listMasterBmhp = res;
           } else if (window.KlinikData && Array.isArray(window.KlinikData.bmhp) && window.KlinikData.bmhp.length > 0) {
               listMasterBmhp = window.KlinikData.bmhp;
           }
           renderTabelBmhp();
           generateKodeBmhp();
       }).withFailureHandler(() => {
           if (window.KlinikData && Array.isArray(window.KlinikData.bmhp) && window.KlinikData.bmhp.length > 0) {
               listMasterBmhp = window.KlinikData.bmhp;
               renderTabelBmhp();
               generateKodeBmhp();
           }
       }).getDaftarBMHPLengkap();
   }
}

// ==========================================
// LOGIKA TAMPILAN / MENU TAB
// ==========================================
function changeDBMenu(menu) {

       }

   if(menu === 'tindakan') {

           btn.classList.add('bg-indigo-50', 'text-indigo-700', 'border-indigo-200/80', 'ring-2', 'ring-indigo-500/30', 'shadow-md');
       }

       if (el) el.classList.remove('hidden');

   } else if(menu === 'bmhp') {

       if (el) el.classList.remove('hidden');

       if (btn) {
           btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200/80', 'shadow-sm');
           btn.classList.add('bg-purple-50', 'text-purple-700', 'border-purple-200/80', 'ring-2', 'ring-purple-500/30', 'shadow-md');
       }
       if (listMasterBmhp.length === 0) {
           loadDaftarBmhpMaster();
       } else {
           renderTabelBmhp();
           generateKodeBmhp();
       }
   } else if(menu === 'gudang') {
       const el = document.getElementById('panelDbGudang');
       if (el) el.classList.remove('hidden');
       let btn = document.getElementById('btnDbGudang');
       if (btn) {
           btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200/80', 'shadow-sm');
           btn.classList.add('bg-amber-50', 'text-amber-700', 'border-amber-200/80', 'ring-2', 'ring-amber-500/30', 'shadow-md');
       }
       if (typeof initInventoryModule === 'function') {
           initInventoryModule();
       }
   } else if(menu === 'user') {
       if (typeof switchMenu === 'function') {
           switchMenu('user-master');
       }
   }
}

// ==========================================
// AUTO-FORMATTER & AUTO-CODE GENERATOR
// ==========================================
function autoTitleCaseDB(el) {
  let val = el.value;
  if (!val) return;
 
  let isAllCaps = val === val.toUpperCase() && val.match(/[a-zA-Z]/);
  if (!isAllCaps) {
      const start = el.selectionStart, end = el.selectionEnd;
      el.value = val.replace(/(^|[\s\/\-\.\(\)])([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase());
      el.setSelectionRange(start, end);
  }
}

function formatRupiahInput(el) {
   let val = el.value.replace(/[^0-9]/g, '');
   if(val === "") { el.value = ""; return; }
   el.value = parseInt(val, 10).toLocaleString('id-ID').replace(/,/g, '.');
}

function parseRupiahRaw(str) {
   if (!str) return 0;
   return parseInt(String(str).replace(/[^0-9]/g, ''), 10) || 0;
}

const fmtRpStr = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka || 0);

function populateKategoriDropdown() {
   let sel = document.getElementById('dbKategori');
   if(!sel) return;
  
   sel.innerHTML = '<option value="" disabled selected>-- Pilih Kategori --</option>';
   listMasterKategori.forEach(k => {
       sel.innerHTML += `<option value="${k.kategori}" data-kode="${k.kode}">${k.kategori}</option>`;
   });
}

function generateKodeTindakan() {
   let sel = document.getElementById('dbKategori');
   if (!sel) return;
   let val = sel.value;
   if(!val) return;
  
   let opt = sel.options[sel.selectedIndex];
   let kodeKat = opt.getAttribute('data-kode');
  
   let maxNum = 0;
   listMasterTindakan.forEach(t => {
       if(t.kode && t.kode.startsWith(kodeKat + "-")) {
           let parts = t.kode.split('-');
           if(parts.length > 1) {
               let num = parseInt(parts[1], 10);
               if(!isNaN(num) && num > maxNum) maxNum = num;
           }
       }
   });
  
   let nextNum = maxNum + 1;
   let finalKode = kodeKat + "-" + String(nextNum).padStart(4, '0');
   let inp = document.getElementById('dbKodeTindakan');
   if (inp) inp.value = finalKode;
}

function generateKodeObat() {
   let maxNum = 0;
   listMasterObat.forEach(o => {
       if (o.kode && o.kode.startsWith('OBT-')) {
           let parts = o.kode.split('-');
           if (parts.length > 1) {
               let num = parseInt(parts[1], 10);
               if (!isNaN(num) && num > maxNum) maxNum = num;
           }
       }
   });
   let nextNum = maxNum + 1;
   let finalKode = 'OBT-' + String(nextNum).padStart(4, '0');
   let inp = document.getElementById('dbKodeObat');
   if (inp) inp.value = finalKode;
}

function generateKodeBmhp() {
   let maxNum = 0;
   listMasterBmhp.forEach(b => {
       if (b.kode && b.kode.startsWith('BMH-')) {
           let parts = b.kode.split('-');
           if (parts.length > 1) {
               let num = parseInt(parts[1], 10);
               if (!isNaN(num) && num > maxNum) maxNum = num;
           }
       }
   });
   let nextNum = maxNum + 1;
   let finalKode = 'BMH-' + String(nextNum).padStart(4, '0');
   let inp = document.getElementById('dbKodeBmhp');
   if (inp) inp.value = finalKode;
}

function hitungMarginObat() {
   let hpp = parseRupiahRaw(document.getElementById('dbHppObat').value);
   let jual = parseRupiahRaw(document.getElementById('dbHargaJualObat').value);
   let el = document.getElementById('dbMarginObat');
   if (!el) return;
   if (hpp > 0 && jual > 0) {
       let margin = ((jual - hpp) / hpp) * 100;
       el.value = margin.toFixed(1) + '%';
       if (margin < 0) {
           el.classList.remove('text-emerald-600');
           el.classList.add('text-rose-600');
       } else {
           el.classList.remove('text-rose-600');
           el.classList.add('text-emerald-600');
       }
   } else {
       el.value = '0%';
   }
}

function hitungHppPcsOtomatis() {
   let elHrg = document.getElementById('dbHargaBeliSatuanObat');
   let elIsi = document.getElementById('dbIsiPerSatuanObat');
   let elHpp = document.getElementById('dbHppObat');
   if (!elHrg || !elIsi || !elHpp) return;
   let hrg = parseRupiahRaw(elHrg.value);
   let isi = parseFloat(elIsi.value) || 1;
   if (hrg > 0 && isi > 0) {
       let hppPcs = Math.round(hrg / isi);
       elHpp.value = formatRibuan(hppPcs);
       hitungMarginObat();
   }
}

function hitungMarginBmhp() {
   let hpp = parseRupiahRaw(document.getElementById('dbHppBmhp').value);
   let jual = parseRupiahRaw(document.getElementById('dbHargaJualBmhp').value);
   let el = document.getElementById('dbMarginBmhp');
   if (!el) return;
   if (hpp > 0 && jual > 0) {
       let margin = ((jual - hpp) / hpp) * 100;
       el.value = margin.toFixed(1) + '%';
       if (margin < 0) {
           el.classList.remove('text-emerald-600');
           el.classList.add('text-rose-600');
       } else {
           el.classList.remove('text-rose-600');
           el.classList.add('text-emerald-600');
       }
   } else {
       el.value = '0%';
   }
}

// ==========================================
// SIMPAN KE DATABASE SPREADSHEET
// ==========================================
function simpanDbTindakan(e) {
   e.preventDefault();
   let mode = document.getElementById('dbTindakanMode') ? document.getElementById('dbTindakanMode').value : 'tambah';
   let btn = document.getElementById('btnSimpanTindakan');
   let originalBtnText = mode === 'edit' ? 'UPDATE TINDAKAN' : 'SIMPAN TINDAKAN';
   btn.innerHTML = 'MENYIMPAN...'; btn.disabled = true;

   let tarifRaw = document.getElementById('dbTarif').value.replace(/\./g, '');
   let perluLabVal = document.getElementById('dbPerluLab') ? document.getElementById('dbPerluLab').value : 'Tidak';
  
   let payload = {
       kode: document.getElementById('dbKodeTindakan').value,
       nama: document.getElementById('dbNamaTindakan').value.trim(),
       kategori: document.getElementById('dbKategori').value,
       tarif: parseInt(tarifRaw, 10) || 0,
       perluLab: perluLabVal,
       currentUser: window.activeNamaAccount
   };

   if (mode === 'edit') {
       google.script.run.withSuccessHandler(res => {
           btn.innerHTML = originalBtnText; btn.disabled = false;
           if (res.success) {
               if (typeof showToast === 'function') showToast('success', res.message); else alert(res.message);
               
               let idx = listMasterTindakan.findIndex(x => x.kode === payload.kode);
               if (idx !== -1) {
                   listMasterTindakan[idx].nama = payload.nama;
                   listMasterTindakan[idx].kategori = payload.kategori;
                   listMasterTindakan[idx].harga = payload.tarif;
                   listMasterTindakan[idx].perluLab = payload.perluLab;
               }
               if (window.KlinikData && Array.isArray(window.KlinikData.tindakan)) {
                   let kIdx = window.KlinikData.tindakan.findIndex(x => x.kode === payload.kode);
                   if (kIdx !== -1) {
                       window.KlinikData.tindakan[kIdx].nama = payload.nama;
                       window.KlinikData.tindakan[kIdx].kategori = payload.kategori;
                       window.KlinikData.tindakan[kIdx].harga = payload.tarif;
                       window.KlinikData.tindakan[kIdx].perluLab = payload.perluLab;
                   }
               }
               batalEditDbTindakan();
               renderTabelTindakan();
           } else {
               if (typeof showToast === 'function') showToast('error', res.message); else alert(res.message);
           }
       }).withFailureHandler(err => {
           btn.innerHTML = originalBtnText; btn.disabled = false;
           if (typeof showToast === 'function') showToast('error', err.message); else alert(err.message);
       }).updateTindakan(payload);
   } else {
       google.script.run.withSuccessHandler(res => {
           btn.innerHTML = originalBtnText; btn.disabled = false;
           if (res.success) {
               if (typeof showToast === 'function') showToast('success', res.message); else alert(res.message);
              
               document.getElementById('formDbTindakan').reset();
               if (document.getElementById('dbPerluLab')) document.getElementById('dbPerluLab').value = '';
              
               let newItem = {
                  kode: payload.kode,
                  nama: payload.nama,
                  kategori: payload.kategori,
                  harga: payload.tarif,
                  perluLab: payload.perluLab
               };
               listMasterTindakan.push(newItem);
               if (window.KlinikData && Array.isArray(window.KlinikData.tindakan)) {
                   window.KlinikData.tindakan.push(newItem);
               }
               renderTabelTindakan();
               generateKodeTindakan();
           } else {
               if (typeof showToast === 'function') showToast('error', res.message); else alert(res.message);
           }
       }).withFailureHandler(err => {
           btn.innerHTML = originalBtnText; btn.disabled = false;
           if (typeof showToast === 'function') showToast('error', err.message); else alert(err.message);
       }).simpanTindakanBaru(payload);
   }
}

function editDbTindakan(kode) {
   let item = listMasterTindakan.find(t => t.kode === kode);
   if (!item) {
       if (typeof showToast === 'function') showToast('error', 'Data tindakan tidak ditemukan.');
       return;
   }

   document.getElementById('dbTindakanMode').value = 'edit';
   document.getElementById('judulFormTindakan').innerText = 'Edit Tindakan: ' + (item.kode || '');
   document.getElementById('btnSimpanTindakan').innerText = 'UPDATE TINDAKAN';
   document.getElementById('btnSimpanTindakan').className = 'w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl shadow-md shadow-emerald-500/30 transition-all text-xs';
   let btnBatal = document.getElementById('btnBatalEditTindakan');
   if (btnBatal) btnBatal.classList.remove('hidden');

   document.getElementById('dbKodeTindakan').value = item.kode || '';
   document.getElementById('dbNamaTindakan').value = item.nama || '';
   document.getElementById('dbKategori').value = item.kategori || '';
   document.getElementById('dbTarif').value = (item.harga || item.tarif || 0).toLocaleString('id-ID').replace(/,/g, '.');
   if (document.getElementById('dbPerluLab')) {
       document.getElementById('dbPerluLab').value = item.perluLab === 'Ya' ? 'Ya' : 'Tidak';
   }

   document.getElementById('formDbTindakan').scrollIntoView({ behavior: 'smooth', block: 'center' });
   document.getElementById('dbNamaTindakan').focus();
}

function batalEditDbTindakan() {
   let form = document.getElementById('formDbTindakan');
   if (form) form.reset();
   document.getElementById('dbTindakanMode').value = 'tambah';
   document.getElementById('judulFormTindakan').innerText = 'Tambah Tindakan Baru';
   let btn = document.getElementById('btnSimpanTindakan');
   btn.innerText = 'SIMPAN TINDAKAN';
   btn.className = 'w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl shadow-md shadow-indigo-500/30 transition-all text-xs';
   let btnBatal = document.getElementById('btnBatalEditTindakan');
   if (btnBatal) btnBatal.classList.add('hidden');
   if (document.getElementById('dbPerluLab')) document.getElementById('dbPerluLab').value = '';
   generateKodeTindakan();
}

function konfirmasiHapusDbTindakan(kode, nama) {
   let konfirm = confirm(`PERINGATAN HAPUS TINDAKAN:\n\nApakah Anda yakin ingin menghapus tindakan:\n"${nama}" (${kode})?\n\nTindakan ini akan dihapus dari Database Master.`);
   if (!konfirm) return;

   google.script.run.withSuccessHandler(res => {
       if (res.success) {
           if (typeof showToast === 'function') showToast('success', res.message); else alert(res.message);
           listMasterTindakan = listMasterTindakan.filter(t => t.kode !== kode);
           if (window.KlinikData && Array.isArray(window.KlinikData.tindakan)) {
               window.KlinikData.tindakan = window.KlinikData.tindakan.filter(t => t.kode !== kode);
           }
           renderTabelTindakan();
           batalEditDbTindakan();
       } else {
           if (typeof showToast === 'function') showToast('error', res.message); else alert(res.message);
       }
   }).withFailureHandler(err => {
       if (typeof showToast === 'function') showToast('error', 'Gagal: ' + err.message); else alert('Gagal: ' + err.message);
   }).hapusTindakan({ kode: kode, currentUser: window.activeNamaAccount });
}

function simpanDbObat(e) {
   e.preventDefault();
   let btn = document.getElementById('btnSimpanObat');
   btn.innerHTML = 'MENYIMPAN...'; btn.disabled = true;

   let satBeli = document.getElementById('dbSatuanBeliObat') ? document.getElementById('dbSatuanBeliObat').value : "Box";
   let isiPerSat = document.getElementById('dbIsiPerSatuanObat') ? parseFloat(document.getElementById('dbIsiPerSatuanObat').value) || 1 : 1;
   let hrgBeliSat = document.getElementById('dbHargaBeliSatuanObat') ? parseRupiahRaw(document.getElementById('dbHargaBeliSatuanObat').value) : 0;
   let hppVal = parseRupiahRaw(document.getElementById('dbHppObat').value);
   if (hrgBeliSat === 0 && hppVal > 0) hrgBeliSat = hppVal * isiPerSat;

   let payload = {
       kode: document.getElementById('dbKodeObat').value,
       nama: document.getElementById('dbNamaObat').value,
       kandungan: document.getElementById('dbKandunganObat') ? document.getElementById('dbKandunganObat').value.trim() : "",
       satuanBeli: satBeli,
       isiPerSatuan: isiPerSat,
       hargaBeliSatuan: hrgBeliSat,
       satuan: document.getElementById('dbSatuanObat').value,
       hpp: hppVal,
       hargaJual: parseRupiahRaw(document.getElementById('dbHargaJualObat').value),
       margin: document.getElementById('dbMarginObat') ? document.getElementById('dbMarginObat').value : "0%",
       stok: parseFloat(document.getElementById('dbStokAwalObat').value) || 0,
       stokMin: parseFloat(document.getElementById('dbStokMinObat').value) || 0,
       expired: document.getElementById('dbExpiredObat').value || "",
       supplier: document.getElementById('dbSupplierObat').value || "",
       currentUser: window.activeNamaAccount
   };

   google.script.run.withSuccessHandler(res => {
       btn.innerHTML = 'SIMPAN OBAT'; btn.disabled = false;
       if (res.success) {
           if (typeof showToast === 'function') showToast('success', res.message); else alert(res.message);
           document.getElementById('formDbObat').reset();
           document.getElementById('dbMarginObat').value = '0%';

           listMasterObat.push({
               kode: payload.kode,
               idObat: payload.kode,
               nama: payload.nama,
               kandungan: payload.kandungan || "-",
               satuanBeli: payload.satuanBeli,
               isiPerSatuan: payload.isiPerSatuan,
               satuan: payload.satuan,
               hargaBeliSatuan: payload.hargaBeliSatuan,
               hpp: payload.hpp,
               hppPcs: payload.hpp,
               margin: payload.margin,
               harga: payload.hargaJual,
               hargaJual: payload.hargaJual,

function renderTabelTindakan() {
   let tbody = document.getElementById('tbodyDbTindakan');
   if (!tbody) return;
   let inp = document.getElementById('cariDbTindakan');
   let q = inp ? inp.value.toLowerCase().trim() : '';
  
   let filtered = listMasterTindakan;
   if(q) {
       filtered = filtered.filter(t => (t.nama && t.nama.toLowerCase().includes(q)) || (t.kode && t.kode.toLowerCase().includes(q)));
   }
  
   filtered = filtered.slice().sort(function(a, b) {
       let kA = String(a.kode || '').trim().toUpperCase();
       let kB = String(b.kode || '').trim().toUpperCase();

       let mA = kA.match(/^([A-Z]+)[-_]?(\d+)/);
       let mB = kB.match(/^([A-Z]+)[-_]?(\d+)/);

       if (mA && mB) {
           let prefA = mA[1];
           let prefB = mB[1];
           if (prefA !== prefB) {
               return prefA.localeCompare(prefB);
           }
           let numA = parseInt(mA[2], 10);
           let numB = parseInt(mB[2], 10);
           if (numA !== numB) {
               return numA - numB;
           }
       }
       return kA.localeCompare(kB, undefined, { numeric: true, sensitivity: 'base' });
   });

   if (filtered.length === 0) {
       tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-slate-400 font-bold">Data tindakan tidak ditemukan.</td></tr>';
       return;
   }

   tbody.innerHTML = filtered.map(t => {
       let isLab = (t.perluLab === 'Ya');
       let labBadge = isLab 
           ? '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-200">🧪 Ya</span>'
           : '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-500">Tidak</span>';
       let cleanNama = (t.nama || '').replace(/'/g, "\\'");

       return `
           <tr class="hover:bg-slate-50 transition-colors border-b border-slate-100">
               <td class="p-3 font-mono font-bold text-indigo-600">${t.kode || '-'}</td>
               <td class="p-3 font-bold text-slate-800">${t.nama || '-'}</td>
               <td class="p-3 text-slate-600"><span class="bg-indigo-50 text-indigo-700 px-2 py-1 rounded font-bold text-[10px]">${t.kategori || '-'}</span></td>
               <td class="p-3 text-right font-black text-slate-800">${fmtRpStr(t.harga || t.tarif || 0)}</td>
               <td class="p-3 text-center">${labBadge}</td>
               <td class="p-3 text-center">
                   <div class="flex justify-center items-center gap-1.5">
                       <button type="button" onclick="editDbTindakan('${t.kode}')" class="px-2.5 py-1 bg-white border border-slate-200 hover:bg-slate-100 text-slate-600 rounded-lg text-[10px] font-bold transition-all shadow-sm">✏️ Edit</button>

function _downloadCsvBlobInBrowser(fileName, csvContent) {
  let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  let url = URL.createObjectURL(blob);
  let link = document.createElement('a');
  link.href = url;
  link.setAttribute('download', fileName);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function _arrayOfObjectsToCsv(arr) {
  if (!Array.isArray(arr) || arr.length === 0) return '\uFEFF"Data Kosong"\r\n';
  let headers = Object.keys(arr[0]);
  let lines = [headers.map(h => '"' + String(h).replace(/"/g, '""') + '"').join(',')];
  arr.forEach(item => {
    let row = headers.map(h => {
      let val = item[h];
      if (val === null || val === undefined) return '';
      if (typeof val === 'object') val = JSON.stringify(val);
      let s = String(val);
      if (s.indexOf('"') !== -1 || s.indexOf(',') !== -1 || s.indexOf('\n') !== -1) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    });
    lines.push(row.join(','));
  });
  return '\uFEFF' + lines.join('\r\n');
}

function _fallbackLocalCsvBackupDownload() {
  let now = new Date();
  let dateStamp = now.toISOString().slice(0, 10);
  let kd = window.KlinikData || {};
  let datasets = [
    { name: `CSV_${dateStamp}_01_PASIEN_Data_Pasien.csv`, data: kd.pasien || [] },
    { name: `CSV_${dateStamp}_02_PEMBAYARAN_Data_Pembayaran.csv`, data: kd.pembayaran || kd.kasir || kd.invoice || [] },
    { name: `CSV_${dateStamp}_03_REKAM_MEDIS_Data_Rekam_Medis.csv`, data: kd.rekamMedis || kd.rm || [] },
    { name: `CSV_${dateStamp}_05_DATABASE_Master_Tindakan.csv`, data: kd.tindakan || [] },
    { name: `CSV_${dateStamp}_06_MASTER_User_Dan_Staff.csv`, data: kd.staff || kd.users || [] },
    { name: `CSV_${dateStamp}_08_OBAT_Master_Obat.csv`, data: kd.obat || [] },
    { name: `CSV_${dateStamp}_09_BMHP_Master_BMHP.csv`, data: kd.bmhp || [] }
  ];
  if (window.PayrollState) {
    datasets.push({ name: `CSV_${dateStamp}_06_MASTER_Pengaturan_Tarif_Shift.csv`, data: window.PayrollState.tarifShift || [] });
    datasets.push({ name: `CSV_${dateStamp}_11_PAYROLL_Presensi_Shift_Harian.csv`, data: window.PayrollState.presensiHarian || window.PayrollState.presensi || [] });
    datasets.push({ name: `CSV_${dateStamp}_11_PAYROLL_Penggajian_Dokter.csv`, data: window.PayrollState.penggajianDokter || [] });
    datasets.push({ name: `CSV_${dateStamp}_11_PAYROLL_Honor_Perawat_Staff.csv`, data: window.PayrollState.honorStaff || [] });
    datasets.push({ name: `CSV_${dateStamp}_02_PEMBAYARAN_Rekap_Jasa_Medis.csv`, data: window.PayrollState.rekapJM || [] });
  }

  // Gabungkan ke 1 Master Bundle CSV + unduh otomatis agar browser tidak memblokir multiple popups
  let bundleSections = [];
  datasets.forEach(ds => {
    if (ds.data && ds.data.length > 0) {
      bundleSections.push(`"=== TABEL: ${ds.name} (${ds.data.length} Baris) ==="\r\n` + _arrayOfObjectsToCsv(ds.data).replace(/^\uFEFF/, ''));
    }
  });
  let masterCsv = '\uFEFF' + (bundleSections.length > 0 ? bundleSections.join('\r\n\r\n') : '"Database RME Sheldon - Snapshot CSV Kosong"');
  let masterFileName = `BACKUP_DATABASE_RME_SHELDON_${dateStamp}_ALL_TABLES.csv`;
  _downloadCsvBlobInBrowser(masterFileName, masterCsv);
  return masterFileName;
}

  const card = document.getElementById('cardFormUser');

  if (!card) return;

function loadDaftarUserMaster(forceReload) {
  ensureUserPanelVisible();
  const tbody = document.getElementById('tbodyDbUser');
  const btnTop = document.getElementById('btnReloadUserMaster');
  const btnTbl = document.getElementById('btnRefreshTabelUser');
  const origTop = btnTop ? (btnTop.getAttribute('data-orig') || btnTop.innerHTML) : '<span>🔄</span> Muat Ulang Data';
  const origTbl = btnTbl ? (btnTbl.getAttribute('data-orig') || btnTbl.innerHTML) : '<span>🔄</span> Refresh';
  if (btnTop && !btnTop.getAttribute('data-orig')) btnTop.setAttribute('data-orig', origTop);
  if (btnTbl && !btnTbl.getAttribute('data-orig')) btnTbl.setAttribute('data-orig', origTbl);

  // 1. SWR Cache First: Jika list in-memory masih kosong, isi dari localStorage / window.KlinikData
  if (!Array.isArray(listMasterUser) || listMasterUser.length === 0) {
    const cachedUsers = getFallbackUserList();
    if (Array.isArray(cachedUsers) && cachedUsers.length > 0) {
      listMasterUser = cachedUsers;
    }
  }

  const hasExistingData = Array.isArray(listMasterUser) && listMasterUser.length > 0;

  // 2. Jika bukan forceReload dan data sudah ada di memori/cache, langsung render instan (< 10ms)
  if (!forceReload && hasExistingData) {
    renderTabelUser();

    // Throttle background sync jika baru saja disinkronkan kurang dari 60 detik atau sedang fetch
    const now = Date.now();
    if (window._userMasterFetching || (window._lastUserMasterFetchTime && (now - window._lastUserMasterFetchTime < 60000))) {
      return;
    }
  }

  // 3. Tangani UI jika forceReload manual
  if (forceReload) {
    if (btnTop) { btnTop.disabled = true; btnTop.innerHTML = '<span class="inline-block animate-spin">⏳</span> Memuat...'; }
    if (btnTbl) { btnTbl.disabled = true; btnTbl.innerHTML = '<span class="inline-block animate-spin">⏳</span> Memuat...'; }
    try {
      localStorage.removeItem('sheldon_master_users_cache');
    } catch (eClean) {}
    if (typeof showToast === 'function') showToast('info', '🔄 Menyinkronkan data pengguna langsung dari Spreadsheet...');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="11" class="text-center py-6 text-slate-400 font-bold"><span class="inline-block animate-spin mr-2">⏳</span>Memuat akun pengguna dari spreadsheet...</td></tr>';
    }
  } else if (!hasExistingData && tbody) {
    tbody.innerHTML = '<tr><td colspan="11" class="text-center py-6 text-slate-400 font-bold"><span class="inline-block animate-spin mr-2">⏳</span>Memuat akun pengguna dari spreadsheet...</td></tr>';
  }

  window._userMasterFetching = true;

  const finishLoad = (usersArr) => {
    window._userMasterFetching = false;
    window._lastUserMasterFetchTime = Date.now();

    if (btnTop) { btnTop.disabled = false; btnTop.innerHTML = origTop; }
    if (btnTbl) { btnTbl.disabled = false; btnTbl.innerHTML = origTbl; }
    
    // Spreadsheet adalah sumber data utama (Single Source of Truth)
    // Jika server mengembalikan array (termasuk array kosong jika seluruh baris dihapus), gunakan data server!
    let loaded = Array.isArray(usersArr) && usersArr.length > 0 ? usersArr : (hasExistingData ? listMasterUser : getFallbackUserList());

    listMasterUser = loaded;
    saveFallbackUserList(listMasterUser);
    renderTabelUser();

    if (forceReload) {
      if (typeof showToast === 'function') {
        showToast('success', '✅ Berhasil memuat ' + listMasterUser.length + ' akun pengguna dari Spreadsheet!');
      }
      const tblCard = document.getElementById('cardTabelUser');
      if (tblCard) {
        tblCard.classList.add('ring-4', 'ring-emerald-500/30', 'border-emerald-500');
        setTimeout(() => {
          tblCard.classList.remove('ring-4', 'ring-emerald-500/30', 'border-emerald-500');
        }, 1400);
      }
    }
  };

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(res => {
        if (Array.isArray(res)) {
          finishLoad(res);
        } else {
          finishLoad(hasExistingData ? listMasterUser : getFallbackUserList());
        }
      })
      .withFailureHandler(err => {
        finishLoad(hasExistingData ? listMasterUser : getFallbackUserList());
      })
      .getDaftarUserMaster();
  } else {
    setTimeout(() => {
      finishLoad(hasExistingData ? listMasterUser : getFallbackUserList());
    }, 200);
  }
}

function renderTabelUser() {
  ensureUserPanelVisible();
  const tbody = document.getElementById('tbodyDbUser');
  if (!tbody) return;

  if (!Array.isArray(listMasterUser)) {
    listMasterUser = getFallbackUserList();
  }

  const badgeTotal = document.getElementById('badgeTotalUser');
  if (badgeTotal) {
    badgeTotal.innerText = listMasterUser.length + ' Akun';
  }

  const keyword = (document.getElementById('cariDbUser') ? document.getElementById('cariDbUser').value : '').toLowerCase().trim();
  
  let filtered = listMasterUser.filter(u => {
    if (!keyword) return true;
    return (u.nama || '').toLowerCase().includes(keyword) ||
           (u.username || '').toLowerCase().includes(keyword) ||
           (u.role || '').toLowerCase().includes(keyword) ||
           (u.noReg || '').toLowerCase().includes(keyword) ||
           (u.noHp || '').toLowerCase().includes(keyword) ||
           (u.email || '').toLowerCase().includes(keyword) ||
           (u.status || '').toLowerCase().includes(keyword);
  });

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11" class="text-center py-6 text-slate-400 font-bold">' + (keyword ? 'Tidak ada pengguna cocok dengan pencarian "' + keyword + '"' : 'Belum ada pengguna terdaftar.') + '</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(u => {
    let rLow = (u.role || '').toLowerCase();
    let roleBadge = 'bg-slate-100 text-slate-700 border border-slate-300 font-bold';
    if (rLow === 'owner' || rLow === 'super user') {
      roleBadge = 'bg-purple-100 text-purple-800 border border-purple-300 font-black';
    } else if (rLow.includes('spesialis')) {
      roleBadge = 'bg-indigo-100 text-indigo-800 border border-indigo-300 font-extrabold';
    } else if (rLow.includes('dokter')) {
      roleBadge = 'bg-sky-100 text-sky-800 border border-sky-300 font-extrabold';
    } else if (rLow.includes('perawat gigi')) {
      roleBadge = 'bg-teal-100 text-teal-800 border border-teal-300 font-extrabold';
    } else if (rLow.includes('perawat')) {
      roleBadge = 'bg-emerald-100 text-emerald-800 border border-emerald-300 font-extrabold';
    } else if (rLow.includes('office')) {
      roleBadge = 'bg-rose-100 text-rose-800 border border-rose-300 font-extrabold';
    } else if (rLow.includes('admin') || rLow.includes('kasir')) {
      roleBadge = 'bg-amber-100 text-amber-900 border border-amber-300 font-extrabold';
    }

    let stRaw = (u.status || 'Aktif').trim();
    let isAktif = (stRaw.toLowerCase() === 'aktif' || stRaw.toLowerCase() === 'active');
    let statusBadge = isAktif
      ? '<span class="px-2.5 py-0.5 bg-emerald-100 text-emerald-700 font-bold rounded-full text-[10px]">Aktif</span>'
      : '<span class="px-2.5 py-0.5 bg-amber-100 text-amber-800 border border-amber-300 font-extrabold rounded-full text-[10px] inline-flex items-center gap-1">⏳ Non Aktif</span>';

    let passBadge = u.isHashed 
      ? '<span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded font-semibold text-[10px] inline-flex items-center gap-1">🔒 SHA-256</span>'
      : (u.hasPassword 
        ? '<span class="px-2 py-0.5 bg-blue-50 text-blue-700 border border-blue-200 rounded font-semibold text-[10px] inline-flex items-center gap-1">🔑 Aktif</span>'
        : '<span class="px-2 py-0.5 bg-rose-50 text-rose-600 border border-rose-200 rounded font-semibold text-[10px]">❌ Kosong</span>');

    let jmDisplay = '-';
    if (rLow.includes('dokter')) {
      let pct = (u.persenJM ? Number(u.persenJM) : 0);
      if (pct <= 1 && pct > 0) pct = Math.round(pct * 100);
      jmDisplay = '<span class="font-bold text-amber-800">' + pct + '%</span>';
    }

    let safeUName = String(u.username || '').replace(/'/g, "\\'");
    let safeNama = String(u.nama || '').replace(/'/g, "\\'");

    let btnAktivasi = !isAktif
      ? `<button type="button" onclick="aktifkanDbUser('${safeUName}', '${safeNama}')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs shadow-sm transition-all active:scale-95">✅ Aktifkan</button>`
      : `<button type="button" onclick="hapusDbUser('${safeUName}', '${safeNama}')" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-lg text-xs transition-all">🗑️ Nonaktifkan</button>`;

function syncUserToClientPayroll(nama, role, status) {
  if (window.PayrollState && Array.isArray(window.PayrollState.tarifShift)) {
    let cleanNama = String(nama || '').trim();
    let cleanRole = String(role || '').trim();
    let cleanStatus = String(status || 'Aktif').trim();
    if (!cleanNama) return;
    let idx = window.PayrollState.tarifShift.findIndex(t => String(t.namaPekerja || '').trim().toLowerCase() === cleanNama.toLowerCase());
    if (idx >= 0) {
      if (cleanRole) window.PayrollState.tarifShift[idx].role = cleanRole;
      window.PayrollState.tarifShift[idx].status = cleanStatus;
    } else {
      let rLow = cleanRole.toLowerCase();
      let tipeKomp = "Uang Harian Shift";
      let s1 = 45000, s2 = 45000, gp = 0;
      let ket = "Shift Rp 45.000/shift";
      if (rLow.includes("dokter") || rLow.includes("spesialis")) {
        tipeKomp = "Kombinasi Shift & Tindakan";
        s1 = 55000; s2 = 55000; gp = 0;
        ket = "2 Shift: Rp 55.000/shift + JM";
      } else if (rLow.includes("admin") || rLow.includes("kasir") || rLow.includes("office")) {
        tipeKomp = "Gaji Bulanan Tetap";
        s1 = 0; s2 = 0; gp = 1200000;
        ket = "Gaji Bulanan Tetap Rp 1.200.000/bulan (Non-Shift)";
      } else if (rLow.includes("owner") || rLow.includes("super")) {
        tipeKomp = "Kombinasi Shift & Tindakan";
        s1 = 55000; s2 = 55000; gp = 0;
        ket = "Shift Rp 55.000/shift + JM";
      }
      let pfx = 'SN-';
      let maxN = 0;
      (window.PayrollState.tarifShift || []).forEach(t => {
        let tid = String(t.idPekerja || t.idAturan || '');
        if (tid.toUpperCase().startsWith(pfx)) {
          let numPart = parseInt(tid.substring(pfx.length), 10);
          if (!isNaN(numPart) && numPart > maxN) maxN = numPart;
        }
      });
      let newId = pfx + String(maxN + 1).padStart(2, '0');
      window.PayrollState.tarifShift.push({
        idAturan: newId,
        idPekerja: newId,
        role: cleanRole || "Staff",
        namaPekerja: cleanNama,
        tipeKompensasi: tipeKomp,
        tarifShift1: s1,
        tarifShift2: s2,
        gajiPokokBulanan: gp,
        status: cleanStatus,
        keterangan: ket
      });
    }
    if (typeof renderAllPayrollTables === 'function') {
      try { renderAllPayrollTables(); } catch (e) {}
    }
  }
}

function aktifkanDbUser(username, nama) {
  if (!confirm('Konfirmasi Aktivasi Account:\nAktifkan pengguna "' + (nama || username) + '" (' + username + ') agar dapat login ke sistem RME?')) {
    return;
  }

  const currentUser = window.activeNamaAccount || 'Super Admin';
  const applyLocalActivate = () => {
    if (!Array.isArray(listMasterUser)) listMasterUser = getFallbackUserList();
    let ex = listMasterUser.find(u => String(u.username || '').toLowerCase() === String(username).toLowerCase());
    if (ex) ex.status = 'Aktif';
    saveFallbackUserList(listMasterUser);
    if (window._mockDb && Array.isArray(window._mockDb.staff)) {
      let st = window._mockDb.staff.find(s => String(s.username || '').toLowerCase() === String(username).toLowerCase());
      if (st) st.status = 'Aktif';
    }
    syncUserToClientPayroll(ex ? ex.nama : (nama || username), ex ? ex.role : '', 'Aktif');
  };

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    if (typeof showToast === 'function') showToast('info', '⏳ Mengaktifkan akun ' + username + '...');
    google.script.run
      .withSuccessHandler(res => {
        applyLocalActivate();
        if (res && res.success) {
          if (typeof showToast === 'function') showToast('success', res.message || ('✅ Akun ' + username + ' berhasil diaktifkan!'));
          loadDaftarUserMaster(false);
        } else {
          // Fallback lewat simpanUserMaster jika aktifkanUserMaster belum di-deploy
          let uObj = listMasterUser.find(u => String(u.username || '').toLowerCase() === String(username).toLowerCase());
          if (uObj) {
            google.script.run
              .withSuccessHandler(() => {
                if (typeof showToast === 'function') showToast('success', '✅ Akun ' + username + ' berhasil diaktifkan!');
                renderTabelUser();
              })
              .simpanUserMaster({
                mode: 'edit',
                nama: uObj.nama,
                username: uObj.username,
                role: uObj.role,
                password: '',
                status: 'Aktif',
                noReg: uObj.noReg,
                noHp: uObj.noHp,
                email: uObj.email || '',
                persenJM: uObj.persenJM || 0,
                currentUser: currentUser
              });
          } else {
            if (typeof showToast === 'function') showToast('success', '✅ Akun ' + username + ' telah diaktifkan!');
            renderTabelUser();
          }
        }
      })
      .withFailureHandler(() => {
        applyLocalActivate();
        if (typeof showToast === 'function') showToast('success', '✅ Akun ' + username + ' telah diaktifkan!');
        renderTabelUser();
      })
      .aktifkanUserMaster(username, currentUser);
  } else {
    applyLocalActivate();
    if (typeof showToast === 'function') showToast('success', '✅ Akun ' + username + ' telah diaktifkan!');
    renderTabelUser();
  }
}

function simpanDbUser(e) {
  if (e) e.preventDefault();
  ensureUserPanelVisible();
  const btn = document.getElementById('btnSimpanUser');
  const origHtml = btn ? btn.innerHTML : '<span>💾</span> SIMPAN PENGGUNA';

  const mode = document.getElementById('dbUserMode').value;
  const nama = (document.getElementById('dbUserNama').value || '').trim();
  const username = (document.getElementById('dbUserUsername').value || '').trim().toLowerCase();
  const role = document.getElementById('dbUserRole').value;
  const password = (document.getElementById('dbUserPassword').value || '').trim();
  const status = document.getElementById('dbUserStatus').value;
  const noReg = (document.getElementById('dbUserNoReg').value || '').trim();
  const noHp = (document.getElementById('dbUserNoHp').value || '').trim();
  const email = (document.getElementById('dbUserEmail') ? document.getElementById('dbUserEmail').value : '').trim();
  const isDokterRole = (role === 'Dokter Gigi Spesialis' || role === 'Dokter Gigi Umum');
  const persenJM = isDokterRole ? (Number(document.getElementById('dbUserPersenJM').value) || 0) : 0;

  if (!nama || !username) {
    showToast('warning', 'Nama Pekerja dan Username wajib diisi!');
    return;
  }

  if (mode === 'tambah' && (!password || password.length < 4)) {
    showToast('warning', 'Password minimal 4 karakter untuk pengguna baru!');
    document.getElementById('dbUserPassword').focus();
    return;
  }

  const currentUser = window.activeNamaAccount || ((window.currentUser && window.currentUser.nama) ? window.currentUser.nama : 'Owner');

  const payload = {
    mode: mode,
    nama: nama,
    username: username,
    role: role,
    password: password,
    status: status,
    noReg: noReg,
    noHp: noHp,
    email: email,
    persenJM: persenJM,
    currentUser: currentUser
  };

  const applyLocalSave = () => {
    if (!Array.isArray(listMasterUser)) listMasterUser = getFallbackUserList();
    let exIdx = listMasterUser.findIndex(u => String(u.username || '').toLowerCase() === username);
    let userObj = {
      nama: nama,
      username: username,
      role: role,
      hasPassword: !!password || (exIdx >= 0 ? listMasterUser[exIdx].hasPassword : true),
      isHashed: true,
      status: status,
      noReg: noReg || '-',
      noHp: noHp || '-',
      email: email || '',
      persenJM: persenJM > 1 ? persenJM / 100 : persenJM
    };
    if (exIdx >= 0) {
      listMasterUser[exIdx] = userObj;
    } else {
      listMasterUser.unshift(userObj);
    }
    saveFallbackUserList(listMasterUser);
    syncUserToClientPayroll(nama, role, status);
  };

  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="inline-block animate-spin mr-1">⏳</span> Menyimpan ke Spreadsheet...'; }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(res => {
        if (btn) { btn.disabled = false; btn.innerHTML = origHtml; }
        if (res && res.success) {
          applyLocalSave();
          showToast('success', res.message || ('Pengguna ' + username + ' berhasil disimpan!'));
          batalEditDbUser(false);
          loadDaftarUserMaster(false);
        } else if (res && res.message && String(res.message).includes('tidak ditemukan')) {
          applyLocalSave();
          showToast('success', 'Pengguna ' + username + ' berhasil disimpan!');
          batalEditDbUser(false);
          renderTabelUser();
        } else {
          showToast('error', (res && res.message) ? res.message : 'Gagal menyimpan user.');
        }
      })
      .withFailureHandler(err => {
        if (btn) { btn.disabled = false; btn.innerHTML = origHtml; }
        let errStr = (err && err.message) ? err.message : String(err);
        showToast('error', 'Gagal: ' + errStr);
      })
      .simpanUserMaster(payload);
  } else {
    setTimeout(() => {
      if (btn) { btn.disabled = false; btn.innerHTML = origHtml; }
      applyLocalSave();
      showToast('success', 'Akun ' + username + ' berhasil disimpan di master!');
      batalEditDbUser(false);
      renderTabelUser();
    }, 400);
  }
}

function editDbUser(username) {
  ensureUserPanelVisible();
  if (typeof toggleFormUser === 'function') toggleFormUser(true);
  if (!Array.isArray(listMasterUser)) listMasterUser = getFallbackUserList();
  const user = listMasterUser.find(u => String(u.username || '').toLowerCase() === String(username).toLowerCase());
  if (!user) {
    showToast('warning', 'Data pengguna tidak ditemukan!');
    return;
  }

  document.getElementById('dbUserMode').value = 'edit';
  document.getElementById('dbUserOrigUsername').value = user.username;
  document.getElementById('dbUserNama').value = user.nama || '';
  
  const uInp = document.getElementById('dbUserUsername');
  uInp.value = user.username || '';
  uInp.readOnly = true;
  uInp.classList.add('bg-slate-200', 'text-slate-500');
  uInp.classList.remove('bg-slate-50');

  let userRole = (user.role || '').trim();
  let roleSelect = document.getElementById('dbUserRole');
  let matched = false;
  for (let opt of roleSelect.options) {
    if (opt.value.toLowerCase() === userRole.toLowerCase()) {
      roleSelect.value = opt.value;
      matched = true;
      break;
    }
  }
  if (!matched) {
    let rLow = userRole.toLowerCase();
    if (rLow.includes('spesialis')) roleSelect.value = 'Dokter Gigi Spesialis';
    else if (rLow.includes('dokter')) roleSelect.value = 'Dokter Gigi Umum';
    else if (rLow.includes('perawat gigi')) roleSelect.value = 'Perawat Gigi';
    else if (rLow.includes('perawat')) roleSelect.value = 'Perawat Umum';
    else if (rLow.includes('office')) roleSelect.value = 'Office';
    else if (rLow.includes('admin') || rLow.includes('kasir')) roleSelect.value = 'Admin';
    else if (rLow.includes('owner') || rLow.includes('super')) roleSelect.value = 'Owner';
    else roleSelect.value = 'Owner';
  }
  document.getElementById('dbUserStatus').value = user.status || 'Aktif';
  document.getElementById('dbUserNoReg').value = user.noReg === '-' ? '' : (user.noReg || '');
  document.getElementById('dbUserNoHp').value = user.noHp === '-' ? '' : (user.noHp || '');
  const emailInp = document.getElementById('dbUserEmail');
  if (emailInp) emailInp.value = user.email === '-' ? '' : (user.email || '');

  let isDokterRole = (roleSelect.value === 'Dokter Gigi Spesialis' || roleSelect.value === 'Dokter Gigi Umum');
  let pct = 0;
  if (isDokterRole && user.persenJM) {
    pct = Number(user.persenJM);
    if (pct <= 1 && pct > 0) pct = Math.round(pct * 100);
  }
  document.getElementById('dbUserPersenJM').value = pct;

  // Password in edit mode is optional
  const passInp = document.getElementById('dbUserPassword');
  passInp.value = '';
  passInp.required = false;
  passInp.placeholder = 'Biarkan kosong jika tidak ganti';
  
  const lblWajib = document.getElementById('labelPassWajib');
  if (lblWajib) lblWajib.innerText = '(opsional)';
  const hintEdit = document.getElementById('hintEditPass');
  if (hintEdit) hintEdit.classList.remove('hidden');

  document.getElementById('judulFormUser').innerText = 'Edit Pengguna: ' + user.nama;
  const badgeMode = document.getElementById('badgeFormUserStatus');
  if (badgeMode) {
    badgeMode.innerText = 'Mode: Edit Akun';
    badgeMode.className = 'px-2 py-0.5 bg-amber-100 text-amber-700 font-bold text-[10px] rounded-full';
  }
  document.getElementById('btnBatalEditUser').classList.remove('hidden');
  document.getElementById('btnSimpanUser').innerHTML = '<span>💾</span> PERBARUI PENGGUNA';

  handleRoleChange();

  const formCard = document.getElementById('cardFormUser') || document.getElementById('panelDbUser');
  if (formCard) {
    formCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
    formCard.classList.add('ring-4', 'ring-amber-500/30', 'border-amber-500');
    setTimeout(() => {
      formCard.classList.remove('ring-4', 'ring-amber-500/30', 'border-amber-500');
    }, 1500);
  }
}

  } else if (Array.isArray(window.listMasterTindakan) && window.listMasterTindakan.length > 0) {
    list = window.listMasterTindakan;
  }
  return list;
}
window.getDaftarMasterTindakanTKD = getDaftarMasterTindakanTKD;

function populateDropdownDokterTKD(selectedNama) {
  const select = document.getElementById('tkdDokter');
  if (!select) return;

  const dokterList = getDaftarDokterGigiTKD();
  let html = '<option value="">-- Pilih Dokter Gigi --</option>';
  dokterList.forEach(d => {
    const isSel = (selectedNama && selectedNama === d.nama) ? 'selected' : '';
    html += `<option value="${d.nama}" data-role="${d.role}" data-rate="${d.persenJM}" ${isSel}>${d.nama} (${d.role})</option>`;
  });
  select.innerHTML = html;
}
window.populateDropdownDokterTKD = populateDropdownDokterTKD;

function filterTindakanByRoleTKD(allTindakan, roleDokter) {
  if (!roleDokter) return (allTindakan || []);
  let role = String(roleDokter).toLowerCase().trim();
  let isSpesialis = role.includes('spesialis');
  let isUmum = role.includes('umum') || role.includes('dokter');

  return (allTindakan || []).filter(function(t) {
    let kat = String(t.kategori || '').toLowerCase().trim();
    let kod = String(t.kode || '').toUpperCase().trim();

    // 1. Kategori Murni 'Umum' (Kode UMM): Muncul kepada SEMUA dokter
    let isKategoriUmum = (kat === 'umum') || kod.startsWith('UMM');
    if (isKategoriUmum) return true;

    // 2. Jika Dokter Gigi Spesialis: Hanya Kategori Dokter Gigi Spesialis (Kode DGS)
    if (isSpesialis) {
      return kat.includes('spesialis') || kod.startsWith('DGS');
    }

    // 3. Jika Dokter Gigi Umum: Hanya Kategori Dokter Gigi Umum (Kode DGU), dan BUKAN spesialis
    if (isUmum) {
      let isDGU = kat === 'dokter gigi umum' || kat.includes('gigi umum') || kod.startsWith('DGU');
      let isDGS = kat.includes('spesialis') || kod.startsWith('DGS');
      return isDGU && !isDGS;
    }

    return kat.includes(role);
  });
}
window.filterTindakanByRoleTKD = filterTindakanByRoleTKD;

function populateDropdownTindakanTKD(selectedNama, filterRole = null) {
  let targetRole = filterRole;
  if (!targetRole) {
    const selDok = document.getElementById('tkdDokter');
    if (selDok && selDok.selectedIndex >= 0 && selDok.options[selDok.selectedIndex]) {
      targetRole = selDok.options[selDok.selectedIndex].getAttribute('data-role') || '';
    }
  }

  const allTindakan = getDaftarMasterTindakanTKD();
  const tindakanList = filterTindakanByRoleTKD(allTindakan, targetRole);

  // Injeksi ke datalist dlTindakanTKD untuk input autocomplete
  const dl = document.getElementById('dlTindakanTKD');
  if (dl) {
    let opts = tindakanList.map(t => {
      const tarif = Number(t.tarif || t.harga || 0);
      const lab = t.perluLab === 'Ya' || t.labor === 'Ya' || (Number(t.labor) > 0) ? 'Lab: Ya' : 'Lab: Tidak';
      const kode = t.kode || t.id || '-';
      return `<option value="${t.nama}">[${kode}] Rp ${tarif.toLocaleString('id-ID')} • ${lab}</option>`;
    }).join('');
    dl.innerHTML = opts;
  }

  // Kompatibilitas jika elemen tkdTindakan adalah select atau input text
  const elTind = document.getElementById('tkdTindakan');
  if (elTind) {
    if (elTind.tagName === 'SELECT') {
      let html = '<option value="">-- Pilih Tindakan Medis --</option>';
      tindakanList.forEach(t => {
        const isSel = (selectedNama && (selectedNama === t.nama || selectedNama === t.kode)) ? 'selected' : '';
        const tarif = Number(t.tarif || t.harga || 0);
        const lab = t.perluLab === 'Ya' || t.labor === 'Ya' || (Number(t.labor) > 0) ? 'Lab: Ya' : 'Lab: Tidak';
        html += `<option value="${t.nama}" data-kode="${t.kode || t.id || ''}" data-tarif="${tarif}" data-labor="${t.perluLab || t.labor || 'Tidak'}" ${isSel}>${t.nama} [${t.kode || '-'}] - Rp ${tarif.toLocaleString('id-ID')} (${lab})</option>`;
      });
      elTind.innerHTML = html;
    } else if (selectedNama !== undefined && selectedNama !== null) {
      elTind.value = selectedNama;
    }
  }
}
window.populateDropdownTindakanTKD = populateDropdownTindakanTKD;

  const elIdTindakan = document.getElementById('tkdIdTindakan');

window.clearTkdTindakanInput = clearTkdTindakanInput;

function onTkdDokterChange() {
  const sel = document.getElementById('tkdDokter');
  if (!sel) return;
  const opt = sel.options[sel.selectedIndex];
  const role = (opt && opt.dataset && opt.dataset.role) ? opt.dataset.role : "";

  // Filter ulang dropdown tindakan sesuai role dokter yang dipilih
  const curTindakan = document.getElementById('tkdTindakan')?.value || "";
  populateDropdownTindakanTKD(curTindakan, role);
  onTkdTindakanChange();

  // % Hak Dokter Khusus default kosong (tidak menimpa nilai)
  hitungSimulasiJMKhusus();
}
window.onTkdDokterChange = onTkdDokterChange;

function onTkdTindakanChange() {
  const elTind = document.getElementById('tkdTindakan');
  if (!elTind) return;
  const rawVal = String(elTind.value || '').trim();
  const tindakanList = getDaftarMasterTindakanTKD();

  let item = null;
  if (rawVal) {
    // 1. Coba exact match nama atau kode
    item = tindakanList.find(t => (t.nama && t.nama.toLowerCase() === rawVal.toLowerCase()) || (t.kode && t.kode.toLowerCase() === rawVal.toLowerCase()));

    // 2. Ekstrak format [KODE] jika user memilih string dengan kode
    if (!item) {
      const m = rawVal.match(/^\[(.*?)\]/);
      if (m && m[1]) {
        const kd = m[1].trim().toLowerCase();
        item = tindakanList.find(t => (t.kode || t.id || '').toLowerCase() === kd);
      }
    }

    // 3. Cek pencarian substring nama atau kode
    if (!item) {
      item = tindakanList.find(t => (t.nama && rawVal.toLowerCase().includes(t.nama.toLowerCase())) || (t.kode && rawVal.toLowerCase().includes(t.kode.toLowerCase())));
    }
  }

  const elIdTindakan = document.getElementById('tkdIdTindakan');
  const elTarifDisplay = document.getElementById('tkdTarifDisplay');
  const elTarif = document.getElementById('tkdTarif');
  const elLabor = document.getElementById('tkdLabor');

  if (item) {
    // Normalisasi input menjadi nama tindakan bersih
    elTind.value = item.nama;

    const kode = item.kode || item.id || '-';
    const tarif = Number(item.tarif || item.harga || 0);
    const perluLab = (item.perluLab === 'Ya' || item.labor === 'Ya' || Number(item.labor) > 0) ? 'Ya' : 'Tidak';

    if (elIdTindakan) elIdTindakan.value = kode;
    if (elTarif) elTarif.value = tarif;
    if (elTarifDisplay) elTarifDisplay.value = 'Rp ' + tarif.toLocaleString('id-ID');
    if (elLabor) elLabor.value = perluLab;
  } else {
    if (elIdTindakan) elIdTindakan.value = '-';
    if (elTarif) elTarif.value = 0;
    if (elTarifDisplay) elTarifDisplay.value = 'Rp 0';
    if (elLabor) elLabor.value = 'Tidak';
  }

  hitungSimulasiJMKhusus();
}
window.onTkdTindakanChange = onTkdTindakanChange;

function hitungSimulasiJMKhusus() {
  const tarif = Number(document.getElementById('tkdTarif')?.value || 0);
  const laborStr = String(document.getElementById('tkdLabor')?.value || 'Tidak').toLowerCase();
  const elPersen = document.getElementById('tkdPersenJM');
  const rawPersen = elPersen ? String(elPersen.value || '').trim() : '';

  let biayaLab = 0;
  const dasarBagiHasil = Math.max(0, tarif - biayaLab);

  if (rawPersen === '') {
    if (document.getElementById('simulasiTarif')) {
      document.getElementById('simulasiTarif').textContent = 'Rp ' + tarif.toLocaleString('id-ID');
    }
    if (document.getElementById('simulasiLab')) {
      document.getElementById('simulasiLab').textContent = (laborStr.includes('ya') ? 'Ada (Syarat Lab)' : 'Rp 0 (Tidak Ada)');
    }
    if (document.getElementById('simulasiPersenDokter')) {
      document.getElementById('simulasiPersenDokter').textContent = '0%';
    }
    if (document.getElementById('simulasiHakDokter')) {
      document.getElementById('simulasiHakDokter').textContent = 'Rp 0';
    }
    if (document.getElementById('simulasiPersenKlinik')) {
      document.getElementById('simulasiPersenKlinik').textContent = '100%';
    }
    if (document.getElementById('simulasiHakKlinik')) {
      document.getElementById('simulasiHakKlinik').textContent = 'Rp ' + tarif.toLocaleString('id-ID');
    }
    return;
  }

  const persenInput = Number(rawPersen);
  const persen = Math.min(100, Math.max(0, persenInput)) / 100;
  const hakDokter = Math.round(dasarBagiHasil * persen);
  const hakKlinik = Math.max(0, tarif - hakDokter);

  if (document.getElementById('simulasiTarif')) {
    document.getElementById('simulasiTarif').textContent = 'Rp ' + tarif.toLocaleString('id-ID');
  }
  if (document.getElementById('simulasiLab')) {
    document.getElementById('simulasiLab').textContent = (laborStr.includes('ya') ? 'Ada (Syarat Lab)' : 'Rp 0 (Tidak Ada)');
  }
  if (document.getElementById('simulasiPersenDokter')) {
    document.getElementById('simulasiPersenDokter').textContent = Math.round(persen * 100) + '%';
  }
  if (document.getElementById('simulasiHakDokter')) {
    document.getElementById('simulasiHakDokter').textContent = 'Rp ' + hakDokter.toLocaleString('id-ID');
  }
  if (document.getElementById('simulasiPersenKlinik')) {
    document.getElementById('simulasiPersenKlinik').textContent = Math.round((1 - persen) * 100) + '%';
  }
  if (document.getElementById('simulasiHakKlinik')) {
    document.getElementById('simulasiHakKlinik').textContent = 'Rp ' + hakKlinik.toLocaleString('id-ID');
  }
}
window.hitungSimulasiJMKhusus = hitungSimulasiJMKhusus;

function generateNextIdAturanTKD() {
  const list = window._tarifKhususList || (window.KlinikData && window.KlinikData.tarifKhusus) || [];
  let maxNum = 0;
  list.forEach(item => {
    const id = String(item.idAturan || item.id || '').trim();
    const match = id.match(/TKD-(\d+)/i);
    if (match) {
      const num = parseInt(match[1], 10);
      if (num > maxNum) maxNum = num;
    }
  });
  const nextNum = maxNum + 1;
  return 'TKD-' + String(nextNum).padStart(2, '0');
}
window.generateNextIdAturanTKD = generateNextIdAturanTKD;

function toggleFormTarifKhusus(show) {
  const box = document.getElementById('boxFormTarifKhusus');
  const btnText = document.getElementById('btnTextTKD');
  const btnIcon = document.getElementById('btnIconTKD');
  if (!box) return;

  const isHidden = box.classList.contains('hidden');
  const shouldOpen = (show !== undefined) ? show : isHidden;

  if (shouldOpen) {
    box.classList.remove('hidden');
    if (btnText) btnText.textContent = 'Tutup Formulir';
    if (btnIcon) btnIcon.textContent = '✕';
    if (!window._isEditModeTKD) {
      resetFormTarifKhusus(false);
    }
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } else {
    box.classList.add('hidden');
    if (btnText) btnText.textContent = 'Tambah Aturan TKD';
    if (btnIcon) btnIcon.textContent = '➕';
    resetFormTarifKhusus(false);
  }
}
window.toggleFormTarifKhusus = toggleFormTarifKhusus;

  window._isEditModeTKD = false;
  const form = document.getElementById('formTKD');
  if (form) form.reset();

  const elIdAturan = document.getElementById('tkdIdAturan');

  if (elLabor) elLabor.value = 'Tidak';

  const elTind = document.getElementById('tkdTindakan');

    badgeMode.textContent = 'Mode: Tambah Baru';

  populateDropdownDokterTKD();

  }

window.resetFormTarifKhusus = resetFormTarifKhusus;

function loadDaftarTarifKhususDokter(forceReload) {
  const tbody = document.getElementById('tbodyTarifKhusus');
  if (tbody && (!window._tarifKhususList || window._tarifKhususList.length === 0)) {
    tbody.innerHTML = '<tr><td colspan="10" class="text-center py-8 text-slate-400 font-bold">Memuat data dari database...</td></tr>';
  }

  if (!forceReload) {
    if (Array.isArray(window.KlinikData?.tarifKhusus) && window.KlinikData.tarifKhusus.length > 0) {
      window._tarifKhususList = window.KlinikData.tarifKhusus;
      renderTabelTarifKhusus();
      return;
    }
  }

  if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.getTarifKhususDokter === 'function') {
    google.script.run
      .withSuccessHandler(res => {
        if (Array.isArray(res)) {
          window._tarifKhususList = res;
          if (window.KlinikData) window.KlinikData.tarifKhusus = res;
        }
        renderTabelTarifKhusus();
      })
      .withFailureHandler(err => {
        console.error('Gagal memuat tarif khusus dokter:', err);
        if (Array.isArray(window.KlinikData?.tarifKhusus)) {
          window._tarifKhususList = window.KlinikData.tarifKhusus;
        }
        renderTabelTarifKhusus();
      })
      .getTarifKhususDokter();
  } else {
    if (Array.isArray(window.KlinikData?.tarifKhusus)) {
      window._tarifKhususList = window.KlinikData.tarifKhusus;
    }
    renderTabelTarifKhusus();
  }
}
window.loadDaftarTarifKhususDokter = loadDaftarTarifKhususDokter;

function renderTabelTarifKhusus() {
  const tbody = document.getElementById('tbodyTarifKhusus');
  const badgeJumlah = document.getElementById('badgeJumlahTKD');
  if (!tbody) return;

  const searchVal = String(document.getElementById('searchTKD')?.value || '').toLowerCase().trim();

    list = list.filter(item => {
      const dok = String(item.namaDokter || item.dokter || '').toLowerCase();
      const tin = String(item.namaTindakan || item.nama || '').toLowerCase();
      const kd = String(item.idTindakan || item.kode || '').toLowerCase();
      const idA = String(item.idAturan || item.id || '').toLowerCase();

  if (list.length === 0) {
    tbody.innerHTML = `

        <td colspan="10" class="text-center py-10 text-slate-400">

      <tr class="hover:bg-emerald-50/40 transition-colors">
        <td class="py-3 px-4 font-mono font-black text-emerald-700 whitespace-nowrap">

            </button>
            <button type="button" onclick="hapusAturanTarifKhusus('${idAturan}')" class="p-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded-lg font-bold text-xs transition-all shadow-xs cursor-pointer" title="Hapus Aturan">

window.renderTabelTarifKhusus = renderTabelTarifKhusus;

function editAturanTarifKhusus(idAturan) {
  const item = (window._tarifKhususList || []).find(x => (x.idAturan || x.id) === idAturan);
  if (!item) {
    if (typeof showToast === 'function') showToast('error', 'Data aturan tidak ditemukan.');
    return;
  }

  window._isEditModeTKD = true;
  toggleFormTarifKhusus(true);

  const badgeMode = document.getElementById('badgeModeTKD');
  if (badgeMode) {
    badgeMode.textContent = `Mode: Edit (${idAturan})`;
    badgeMode.className = 'px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-100 text-amber-800 border border-amber-200';
  }

  const btnSubmit = document.getElementById('btnSubmitTKD');
  if (btnSubmit) {
    btnSubmit.innerHTML = '<span>💾</span> Perbarui Aturan TKD';
  }

  document.getElementById('tkdIdAturan').value = item.idAturan || item.id || idAturan;
  populateDropdownDokterTKD(item.namaDokter || item.dokter);
  populateDropdownTindakanTKD(item.namaTindakan || item.nama);

  document.getElementById('tkdIdTindakan').value = item.idTindakan || item.kode || '-';
  const tarif = Number(item.tarif || 0);
  document.getElementById('tkdTarif').value = tarif;
  document.getElementById('tkdTarifDisplay').value = 'Rp ' + tarif.toLocaleString('id-ID');
  document.getElementById('tkdLabor').value = item.labor || 'Tidak';

  let pct = Number(item.persenJM || 0.5);
  if (pct <= 1) pct = Math.round(pct * 100);
  document.getElementById('tkdPersenJM').value = pct;
  document.getElementById('tkdKeterangan').value = item.keterangan || '';

  hitungSimulasiJMKhusus();
}
window.editAturanTarifKhusus = editAturanTarifKhusus;

function simpanAturanTarifKhusus(e) {
  if (e && e.preventDefault) e.preventDefault();

  const idAturan = String(document.getElementById('tkdIdAturan')?.value || '').trim() || generateNextIdAturanTKD();
  const dokter = String(document.getElementById('tkdDokter')?.value || '').trim();
  const tindakan = String(document.getElementById('tkdTindakan')?.value || '').trim();
  const idTindakan = String(document.getElementById('tkdIdTindakan')?.value || '').trim();
  const tarif = Number(document.getElementById('tkdTarif')?.value || 0);
  const labor = String(document.getElementById('tkdLabor')?.value || 'Tidak').trim();
  const persenInput = Number(document.getElementById('tkdPersenJM')?.value || 0);
  const keterangan = String(document.getElementById('tkdKeterangan')?.value || '').trim();

  if (!dokter) {
    if (typeof showToast === 'function') showToast('warning', 'Silakan pilih dokter gigi terdaftar!');
    return;
  }
  if (!tindakan) {
    if (typeof showToast === 'function') showToast('warning', 'Silakan pilih tindakan medis!');
    return;
  }
  if (persenInput <= 0 || persenInput > 100) {
    if (typeof showToast === 'function') showToast('warning', 'Persentase hak dokter harus antara 1% - 100%!');
    return;
  }

  const persenJM = persenInput / 100;
  const payload = {
    idAturan: idAturan,
    namaDokter: dokter,
    idTindakan: idTindakan,
    namaTindakan: tindakan,
    tarif: tarif,
    labor: labor,
    persenJM: persenJM,
    keterangan: keterangan
  };

  const btnSubmit = document.getElementById('btnSubmitTKD');
  const origText = btnSubmit ? btnSubmit.innerHTML : '';
  if (btnSubmit) {
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = '<span>⏳</span> Menyimpan...';
  }

  function handleSaveSuccess(msg) {
    if (btnSubmit) {
      btnSubmit.disabled = false;
      btnSubmit.innerHTML = origText;
    }
    if (!Array.isArray(window._tarifKhususList)) window._tarifKhususList = [];
    const idx = window._tarifKhususList.findIndex(x => (x.idAturan || x.id) === idAturan);
    const record = {
      idAturan: idAturan,
      dokter: dokter,
      namaDokter: dokter,
      kode: idTindakan,
      idTindakan: idTindakan,
      nama: tindakan,
      namaTindakan: tindakan,
      tarif: tarif,
      labor: labor,
      persenJM: persenJM,
      persenJMDisplay: Math.round(persenJM * 100) + '%',
      keterangan: keterangan
    };
    if (idx !== -1) {
      window._tarifKhususList[idx] = record;
    } else {
      window._tarifKhususList.push(record);
    }
    if (window.KlinikData) window.KlinikData.tarifKhusus = window._tarifKhususList;

    resetFormTarifKhusus(true);
    renderTabelTarifKhusus();
    if (typeof showToast === 'function') showToast('success', msg || `Aturan ${idAturan} berhasil disimpan!`);
  }

  if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.simpanTarifKhususDokter === 'function') {
    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success) {
          handleSaveSuccess(res.message);
        } else {
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = origText;
          }
          if (typeof showToast === 'function') showToast('error', (res && res.message) ? res.message : 'Gagal menyimpan aturan.');
        }
      })
      .withFailureHandler(err => {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = origText;
        }
        if (typeof showToast === 'function') showToast('error', 'Error: ' + (err.message || err));
      })
      .simpanTarifKhususDokter(payload);
  } else {
    handleSaveSuccess(`Aturan ${idAturan} berhasil disimpan di sistem lokal!`);
  }
}
window.simpanAturanTarifKhusus = simpanAturanTarifKhusus;

function hapusAturanTarifKhusus(idAturan) {
  if (!confirm(`Apakah Anda yakin ingin menghapus aturan tindakan khusus ${idAturan}?`)) return;

  function handleDeleteSuccess(msg) {
    if (Array.isArray(window._tarifKhususList)) {
      window._tarifKhususList = window._tarifKhususList.filter(x => (x.idAturan || x.id) !== idAturan);
    }
    if (window.KlinikData && Array.isArray(window.KlinikData.tarifKhusus)) {
      window.KlinikData.tarifKhusus = window._tarifKhususList;
    }
    renderTabelTarifKhusus();
    if (typeof showToast === 'function') showToast('success', msg || `Aturan ${idAturan} berhasil dihapus.`);
  }

  if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.hapusTarifKhususDokter === 'function') {
    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success) {
          handleDeleteSuccess(res.message);
        } else {
          if (typeof showToast === 'function') showToast('error', (res && res.message) ? res.message : 'Gagal menghapus aturan.');
        }
      })
      .withFailureHandler(err => {
        if (typeof showToast === 'function') showToast('error', 'Error Hapus: ' + (err.message || err));
      })
      .hapusTarifKhususDokter({ idAturan: idAturan });
  } else {
    handleDeleteSuccess(`Aturan ${idAturan} berhasil dihapus dari sistem lokal.`);
  }
}
window.hapusAturanTarifKhusus = hapusAturanTarifKhusus;

</script>
