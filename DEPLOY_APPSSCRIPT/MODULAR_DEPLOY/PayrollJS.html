<script>
  // =========================================================================
  // PAYROLL, PRESENSI SHIFT & JASA MEDIS FRONTEND CONTROLLER (PayrollJS.html)
  // =========================================================================

  window.PayrollState = {
    spreadsheetUrl: "",
    tarifShift: [],
    presensiHarian: [],
    penggajianDokter: [],
    honorStaff: [],
    rekapJM: []
  };

  function getDefaultPayrollSeed() {
    return {
      tarifShift: [
        { idAturan: "SN-01", idPekerja: "SN-01", role: "Owner", namaPekerja: "Vembrian Asung Nugroho", tipeKompensasi: "Kombinasi Shift & Tindakan", tarifShift1: 55000, tarifShift2: 55000, gajiPokokBulanan: 0, status: "Aktif", keterangan: "Shift Rp 55.000/shift + JM 65%" },
        { idAturan: "SN-02", idPekerja: "SN-02", role: "Dokter Gigi Spesialis", namaPekerja: "drg. Rahma Yulinda D, Sp. BMM", tipeKompensasi: "Kombinasi Shift & Tindakan", tarifShift1: 55000, tarifShift2: 55000, gajiPokokBulanan: 0, status: "Aktif", keterangan: "2 Shift: Rp 55.000/shift + JM 65%" },
        { idAturan: "SN-03", idPekerja: "SN-03", role: "Dokter Gigi Umum", namaPekerja: "drg. Regyana Oktavaria", tipeKompensasi: "Kombinasi Shift & Tindakan", tarifShift1: 55000, tarifShift2: 55000, gajiPokokBulanan: 0, status: "Aktif", keterangan: "2 Shift: Rp 55.000/shift + JM 40%" },
        { idAturan: "SN-04", idPekerja: "SN-04", role: "Dokter Gigi Umum", namaPekerja: "drg. Tia Ardhana R", tipeKompensasi: "Kombinasi Shift & Tindakan", tarifShift1: 55000, tarifShift2: 55000, gajiPokokBulanan: 0, status: "Aktif", keterangan: "2 Shift: Rp 55.000/shift + JM 50%" },
        { idAturan: "SN-05", idPekerja: "SN-05", role: "Dokter Gigi Umum", namaPekerja: "drg. Latifah Mulyana", tipeKompensasi: "Kombinasi Shift & Tindakan", tarifShift1: 55000, tarifShift2: 55000, gajiPokokBulanan: 0, status: "Tidak Aktif", keterangan: "2 Shift: Rp 55.000/shift + JM 40%" },
        { idAturan: "SN-06", idPekerja: "SN-06", role: "Perawat Gigi", namaPekerja: "Eva Nurmiza, AMKG", tipeKompensasi: "Uang Harian Shift", tarifShift1: 45000, tarifShift2: 45000, gajiPokokBulanan: 0, status: "Aktif", keterangan: "Shift Rp 45.000/shift" },
        { idAturan: "SN-07", idPekerja: "SN-07", role: "Perawat Gigi", namaPekerja: "Fitriyati, AMKG", tipeKompensasi: "Uang Harian Shift", tarifShift1: 45000, tarifShift2: 45000, gajiPokokBulanan: 0, status: "Aktif", keterangan: "Shift Rp 45.000/shift" },
        { idAturan: "SN-08", idPekerja: "SN-08", role: "Perawat Umum", namaPekerja: "Riri Afriyanti", tipeKompensasi: "Uang Harian Shift", tarifShift1: 45000, tarifShift2: 45000, gajiPokokBulanan: 0, status: "Aktif", keterangan: "Shift Rp 45.000/shift" },
        { idAturan: "SN-09", idPekerja: "SN-09", role: "Admin", namaPekerja: "Sri Purwanti", tipeKompensasi: "Gaji Bulanan Tetap", tarifShift1: 0, tarifShift2: 0, gajiPokokBulanan: 1200000, status: "Aktif", keterangan: "Gaji Bulanan Tetap Rp 1.200.000/bulan" },
        { idAturan: "SN-10", idPekerja: "SN-10", role: "Perawat Gigi", namaPekerja: "Indah Hapsari", tipeKompensasi: "Uang Harian Shift", tarifShift1: 45000, tarifShift2: 45000, gajiPokokBulanan: 0, status: "Tidak Aktif", keterangan: "Shift Rp 45.000/shift" },
        { idAturan: "SN-11", idPekerja: "SN-11", role: "Perawat Umum", namaPekerja: "Atika Maysaroh", tipeKompensasi: "Uang Harian Shift", tarifShift1: 45000, tarifShift2: 45000, gajiPokokBulanan: 0, status: "Tidak Aktif", keterangan: "Shift Rp 45.000/shift" }
      ],
      presensiHarian: [],
      penggajianDokter: [],
      honorStaff: [],
      rekapJM: []
    };
  }

  function fmtRpPayroll(num) {
    let n = Math.round(Number(num) || 0);
    return 'Rp ' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }

  function fmtTimePayroll(val) {
    if (!val) return '';
    let s = String(val).trim();
    if (s.includes('1899') || s.includes('GMT') || s.length > 10) {
      let m = s.match(/(\d{1,2}):(\d{2})/);
      if (m) return m[1].padStart(2, '0') + ':' + m[2];
    }
    return s;
  }

  function initPayrollModule() {
    try {
      let raw = localStorage.getItem('sheldon_payroll_cache');
      if (raw && (raw.includes('INV/SIMULASI') || raw.includes('SIMULASI') || raw.includes('ATT-202610-001'))) {
        localStorage.removeItem('sheldon_payroll_cache');
      }
    } catch (e) {}
    loadPayrollModuleData(false);
    if (typeof handleTarifTipeChange === 'function') handleTarifTipeChange();
  }

  function switchPayrollTab(tabKey) {
    let targetSubMode = null;
    if (tabKey === 'dokter') {
      tabKey = 'gaji-jm';
      targetSubMode = 'dokter';
    } else if (tabKey === 'staff') {
      tabKey = 'gaji-jm';
      targetSubMode = 'staff';
    } else if (tabKey === 'gaji-jm') {
      targetSubMode = 'all';
    }

    document.querySelectorAll('.payroll-tab-panel').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.payroll-tab-btn').forEach(btn => {
      btn.classList.remove('bg-gradient-to-r', 'from-indigo-600', 'to-blue-600', 'text-white', 'shadow-lg', 'shadow-indigo-500/30', 'ring-2', 'ring-indigo-400/50', 'scale-[1.02]');
      btn.classList.add('bg-white/10', 'text-slate-200', 'hover:bg-white/15', 'hover:text-white', 'border', 'border-white/10');
    });

    const panel = document.getElementById('panelPay-' + tabKey);
    const activeBtn = document.getElementById('tabBtnPay-' + tabKey);
    if (panel) panel.classList.remove('hidden');
    if (activeBtn) {
      activeBtn.classList.remove('bg-white/10', 'text-slate-200', 'hover:bg-white/15', 'hover:text-white', 'border', 'border-white/10');
      activeBtn.classList.add('bg-gradient-to-r', 'from-indigo-600', 'to-blue-600', 'text-white', 'shadow-lg', 'shadow-indigo-500/30', 'ring-2', 'ring-indigo-400/50', 'scale-[1.02]');
    }

    if (targetSubMode && typeof filterGajiJmView === 'function') {
      filterGajiJmView(targetSubMode);
    }
  }

  function filterGajiJmView(mode) {
    const dokterSec = document.getElementById('panelPay-dokter');
    const staffSec = document.getElementById('panelPay-staff');
    const btnAll = document.getElementById('btnFilterGajiJm-all');
    const btnDokter = document.getElementById('btnFilterGajiJm-dokter');
    const btnStaff = document.getElementById('btnFilterGajiJm-staff');

    const inactiveClass = 'px-3.5 py-2 rounded-xl font-bold text-xs text-slate-600 hover:text-indigo-600 hover:bg-white/60 transition-all flex items-center gap-1.5 cursor-pointer';
    const activeClassAll = 'px-3.5 py-2 rounded-xl font-black text-xs bg-white text-indigo-700 shadow-md border border-indigo-100 transition-all flex items-center gap-1.5 cursor-pointer';
    const activeClassDok = 'px-3.5 py-2 rounded-xl font-black text-xs bg-white text-indigo-700 shadow-md border border-indigo-100 transition-all flex items-center gap-1.5 cursor-pointer';
    const activeClassStf = 'px-3.5 py-2 rounded-xl font-black text-xs bg-white text-cyan-700 shadow-md border border-cyan-100 transition-all flex items-center gap-1.5 cursor-pointer';

    if (btnAll) btnAll.className = inactiveClass;
    if (btnDokter) btnDokter.className = inactiveClass;
    if (btnStaff) btnStaff.className = inactiveClass;

    if (mode === 'dokter') {
      if (dokterSec) dokterSec.classList.remove('hidden');
      if (staffSec) staffSec.classList.add('hidden');
      if (btnDokter) btnDokter.className = activeClassDok;
    } else if (mode === 'staff') {
      if (dokterSec) dokterSec.classList.add('hidden');
      if (staffSec) staffSec.classList.remove('hidden');
      if (btnStaff) btnStaff.className = activeClassStf;
    } else {
      // 'all'
      if (dokterSec) dokterSec.classList.remove('hidden');
      if (staffSec) staffSec.classList.remove('hidden');
      if (btnAll) btnAll.className = activeClassAll;
    }
  }

  function loadPayrollModuleData(showOverlay) {
    if (showOverlay) {
      try {
        localStorage.removeItem('sheldon_payroll_cache');
      } catch (e) {}
    }
    if (showOverlay && typeof showDbSyncOverlay === 'function') {
      showDbSyncOverlay('🔄 Menyinkronkan Data Payroll, Presensi Shift & JM...');
    }

    const seed = getDefaultPayrollSeed();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (showOverlay && typeof hideDbSyncOverlay === 'function') hideDbSyncOverlay();
          if (res && res.success) {
            window.PayrollState.spreadsheetUrl = res.spreadsheetUrl || "";
            // Spreadsheet adalah Single Source of Truth: jika di spreadsheet kosong/dihapus, web juga tampil kosong
            window.PayrollState.tarifShift = Array.isArray(res.tarifShift) ? res.tarifShift : [];
            window.PayrollState.presensiHarian = Array.isArray(res.presensiHarian) ? res.presensiHarian : [];
            window.PayrollState.penggajianDokter = Array.isArray(res.penggajianDokter) ? res.penggajianDokter : [];
            window.PayrollState.honorStaff = Array.isArray(res.honorStaff) ? res.honorStaff : [];
            window.PayrollState.rekapJM = Array.isArray(res.rekapJM) ? res.rekapJM : [];

            savePayrollCacheLocal();

            const btnSheet = document.getElementById('btnOpenPayrollSheet');
            if (btnSheet && res.spreadsheetUrl) {
              btnSheet.href = res.spreadsheetUrl;
              btnSheet.classList.remove('hidden');
              btnSheet.classList.add('inline-flex');
            }
            renderAllPayrollTables();
            if (showOverlay && typeof showToast === 'function') {
              showToast('success', 'Data Payroll & Jasa Medis berhasil disinkronkan dari Spreadsheet!');
            }
          } else {
            applyPayrollFallbackSeed(seed);
          }
        })
        .withFailureHandler((err) => {
          if (showOverlay && typeof hideDbSyncOverlay === 'function') hideDbSyncOverlay();
          if (typeof showToast === 'function') showToast('error', 'Gagal memuat data dari Spreadsheet: ' + (err && err.message ? err.message : 'Koneksi terputus'));
          applyPayrollFallbackSeed(seed);
        })
        .getPayrollModuleData();
    } else {
      if (showOverlay && typeof hideDbSyncOverlay === 'function') hideDbSyncOverlay();
      applyPayrollFallbackSeed(seed);
    }
  }

  function applyPayrollFallbackSeed(seed) {
    let cached = null;
    try {
      let raw = localStorage.getItem('sheldon_payroll_cache');
      if (raw) cached = JSON.parse(raw);
    } catch (e) {}

    window.PayrollState.tarifShift = (cached && Array.isArray(cached.tarifShift)) ? cached.tarifShift : (seed.tarifShift || []);
    window.PayrollState.presensiHarian = (cached && Array.isArray(cached.presensiHarian)) ? cached.presensiHarian : (seed.presensiHarian || []);
    window.PayrollState.penggajianDokter = (cached && Array.isArray(cached.penggajianDokter)) ? cached.penggajianDokter : (seed.penggajianDokter || []);
    window.PayrollState.honorStaff = (cached && Array.isArray(cached.honorStaff)) ? cached.honorStaff : (seed.honorStaff || []);
    window.PayrollState.rekapJM = (cached && Array.isArray(cached.rekapJM)) ? cached.rekapJM : [];
    renderAllPayrollTables();
  }

  function savePayrollCacheLocal() {
    try {
      localStorage.setItem('sheldon_payroll_cache', JSON.stringify(window.PayrollState));
    } catch (e) {}
  }

  function recalculateShiftTotalsFromPresensi() {
    const presList = window.PayrollState.presensiHarian || [];
    const tarifList = window.PayrollState.tarifShift || [];

    const getRate = (nama, shiftStr, defaultVal) => {
      let t = tarifList.find(x => String(x.namaPekerja || '').toLowerCase() === String(nama || '').toLowerCase());
      if (!t) return defaultVal;
      let rawVal = String(shiftStr).includes('2') ? t.tarifShift2 : t.tarifShift1;
      return (rawVal !== undefined && rawVal !== null && rawVal !== '' && !isNaN(Number(rawVal))) ? Number(rawVal) : defaultVal;
    };

    // Hitung ulang per pekerja
    let mapShift = {};
    presList.forEach(p => {
      if (String(p.statusKehadiran || '').toLowerCase() !== 'hadir') return;
      let nm = String(p.namaPekerja || '').trim();
      if (!mapShift[nm]) mapShift[nm] = { s1: 0, s2: 0, uang: 0 };
      let isS2 = String(p.shift || '').includes('2');
      if (isS2) mapShift[nm].s2 += 1;
      else mapShift[nm].s1 += 1;
      let hasNominal = (p.uangHarianDidapat !== undefined && p.uangHarianDidapat !== null && p.uangHarianDidapat !== '' && !isNaN(Number(p.uangHarianDidapat)));
      let nominal = hasNominal ? Number(p.uangHarianDidapat) : getRate(nm, p.shift, String(p.role).toLowerCase().includes('dokter') ? 55000 : 45000);
      p.uangHarianDidapat = nominal;
      mapShift[nm].uang += nominal;
    });

    (window.PayrollState.penggajianDokter || []).forEach(d => {
      let st = mapShift[d.namaDokter];
      d.hadirShift1 = st ? st.s1 : 0;
      d.hadirShift2 = st ? st.s2 : 0;
      d.totalUangHarianShift = st ? st.uang : 0;
      let potongan = (Number(d.potonganPPh21) || 0) + (Number(d.potonganKasbon) || 0);
      d.totalDiterimaTHP = (Number(d.totalJMDokter) || 0) + (Number(d.totalUangHarianShift) || 0) + (Number(d.bonusInsentif) || 0) - potongan;
    });

    (window.PayrollState.honorStaff || []).forEach(s => {
      let st = mapShift[s.namaStaff];
      let rLow = String(s.role || '').toLowerCase();
      let isNonShift = rLow.includes('admin') || rLow.includes('office');
      if (!isNonShift) {
        s.hadirShift1 = st ? st.s1 : 0;
        s.hadirShift2 = st ? st.s2 : 0;
        s.totalUangHarianShift = st ? st.uang : 0;
      }
      let tunjangan = (Number(s.totalFeeTindakan) || 0) + (Number(s.uangMakanTransport) || 0) + (Number(s.lembur) || 0);
      s.totalDiterimaTHP = (Number(s.gajiPokokBulanan) || 0) + (Number(s.totalUangHarianShift) || 0) + tunjangan - (Number(s.potonganKasbon) || 0);
    });
  }

  function isPekerjaAktif(nama) {
    if (!nama) return false;
    let found = (window.PayrollState.tarifShift || []).find(t => String(t.namaPekerja || '').trim().toLowerCase() === String(nama).trim().toLowerCase());
    if (found) {
      let st = String(found.status || 'Aktif').trim().toLowerCase();
      return st !== 'tidak aktif' && st !== 'non aktif' && st !== 'nonaktif' && st !== 'inactive';
    }
    return true;
  }

  function populateStaffDatalist() {
    const dl = document.getElementById('listStaffMasterData');
    if (!dl) return;
    const staffList = (window.KlinikData && Array.isArray(window.KlinikData.staff)) ? window.KlinikData.staff : [];
    dl.innerHTML = staffList.map(s => `<option value="${s.nama}">${s.nama} (${s.role || 'Staff'})</option>`).join('');
  }

  function renderAllPayrollTables() {
    populateStaffDatalist();
    recalculateShiftTotalsFromPresensi();

    // Saring hanya pekerja AKTIF agar pekerja Tidak Aktif tidak muncul di Payroll
    const listDok = (window.PayrollState.penggajianDokter || []).filter(d => isPekerjaAktif(d.namaDokter));
    const listStf = (window.PayrollState.honorStaff || []).filter(s => isPekerjaAktif(s.namaStaff));
    const listPres = (window.PayrollState.presensiHarian || []).filter(p => isPekerjaAktif(p.namaPekerja));

    // 1. Update KPI Cards
    let totDokter = 0;
    listDok.forEach(d => { totDokter += Number(d.totalDiterimaTHP) || 0; });

    let totStaff = 0;
    listStf.forEach(s => { totStaff += Number(s.totalDiterimaTHP) || 0; });

    let totShift = 0;
    let countHadir = 0;
    listPres.forEach(p => {
      if (String(p.statusKehadiran || '').toLowerCase() === 'hadir') {
        countHadir++;
        totShift += Number(p.uangHarianDidapat) || 0;
      }
    });

    const elKpiDok = document.getElementById('kpiTotalThpDokter');
    const elCntDok = document.getElementById('kpiCountDokter');
    const elKpiStf = document.getElementById('kpiTotalThpStaff');
    const elCntStf = document.getElementById('kpiCountStaff');
    const elKpiShf = document.getElementById('kpiTotalUangShift');
    const elCntPrs = document.getElementById('kpiCountPresensi');
    const elGrand = document.getElementById('kpiGrandTotalPayroll');

    if (elKpiDok) elKpiDok.innerText = fmtRpPayroll(totDokter);
    if (elCntDok) elCntDok.innerText = listDok.length + ' Dokter Aktif';
    if (elKpiStf) elKpiStf.innerText = fmtRpPayroll(totStaff);
    if (elCntStf) elCntStf.innerText = listStf.length + ' Perawat & Admin';
    if (elKpiShf) elKpiShf.innerText = fmtRpPayroll(totShift);
    if (elCntPrs) elCntPrs.innerText = countHadir + ' Shift Kehadiran Tercatat';
    if (elGrand) elGrand.innerText = fmtRpPayroll(totDokter + totStaff);

    // 2. Render Tabel Penggajian Dokter
    const tbDok = document.getElementById('tbodyPayrollDokter');
    if (tbDok) {
      if (listDok.length === 0) {
        tbDok.innerHTML = '<tr><td colspan="11" class="py-8 text-center text-slate-400 font-bold">Belum ada data penggajian dokter aktif.</td></tr>';
      } else {
        tbDok.innerHTML = listDok.map((d, idx) => {
          let pot = (Number(d.potonganPPh21) || 0) + (Number(d.potonganKasbon) || 0);
          let stColor = d.statusTransfer === 'Paid'
            ? 'bg-emerald-100 text-emerald-800 border-emerald-300'
            : (d.statusTransfer === 'Approved' ? 'bg-blue-100 text-blue-800 border-blue-300' : 'bg-amber-100 text-amber-800 border-amber-300');
          return `
            <tr class="hover:bg-indigo-50/40 transition-colors">
              <td class="py-3 px-4">
                <div class="font-mono font-black text-indigo-700 text-[11px]">${d.idPayroll}</div>
                <div class="text-[10px] font-bold text-slate-500">${d.periodeBulan}</div>
              </td>
              <td class="py-3 px-4">
                <div class="font-black text-slate-800">${d.namaDokter}</div>
                <div class="text-[10px] text-slate-500">${d.catatan || ''}</div>
              </td>
              <td class="py-3 px-3 text-center font-black text-slate-700">${d.totalPasien}</td>
              <td class="py-3 px-4 text-right font-bold text-slate-700">${fmtRpPayroll(d.totalTindakanBruto)}</td>
              <td class="py-3 px-4 text-right font-black text-emerald-700">${fmtRpPayroll(d.totalJMDokter)}</td>
              <td class="py-3 px-3 text-center">
                <span class="px-2 py-0.5 rounded-lg bg-slate-100 border border-slate-200 font-extrabold text-[11px] text-slate-700">
                  S1: ${d.hadirShift1}x • S2: ${d.hadirShift2}x
                </span>
              </td>
              <td class="py-3 px-4 text-right font-bold text-cyan-700">${fmtRpPayroll(d.totalUangHarianShift)}</td>
              <td class="py-3 px-4 text-right font-bold text-rose-600">${fmtRpPayroll(pot)}</td>
              <td class="py-3 px-4 text-right font-black text-indigo-900 bg-indigo-50/60 text-sm">${fmtRpPayroll(d.totalDiterimaTHP)}</td>
              <td class="py-3 px-3 text-center">
                <span class="px-2.5 py-1 rounded-full text-[10px] font-black border ${stColor}">${d.statusTransfer}</span>
              </td>
              <td class="py-3 px-4 text-center">
                <div class="flex items-center justify-center gap-1.5">
                  <button type="button" onclick="openSlipGajiModal('dokter', ${idx})" class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-[10px] font-extrabold shadow-sm">
                    🖨️ Slip
                  </button>
                  <button type="button" onclick="togglePayrollPaidStatus('dokter', ${idx})" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-[10px] font-extrabold shadow-sm" title="Tandai Lunas / Paid">
                    ✓ Paid
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      }
    }

    // 3. Render Tabel Honor Perawat & Admin
    const tbStf = document.getElementById('tbodyPayrollStaff');
    if (tbStf) {
      if (listStf.length === 0) {
        tbStf.innerHTML = '<tr><td colspan="11" class="py-8 text-center text-slate-400 font-bold">Belum ada data honor perawat & admin aktif.</td></tr>';
      } else {
        tbStf.innerHTML = listStf.map((s, idx) => {
          let tunj = (Number(s.totalFeeTindakan) || 0) + (Number(s.uangMakanTransport) || 0) + (Number(s.lembur) || 0);
          let stColor = s.statusTransfer === 'Paid'
            ? 'bg-emerald-100 text-emerald-800 border-emerald-300'
            : 'bg-amber-100 text-amber-800 border-amber-300';
          let rLow = String(s.role || '').toLowerCase();
          let isNonShift = rLow.includes('admin') || rLow.includes('office');
          let rBadgeStaff = 'bg-slate-100 text-slate-700 border-slate-300';
          if (rLow === 'owner' || rLow === 'super user') rBadgeStaff = 'bg-purple-100 text-purple-800 border-purple-300';
          else if (rLow.includes('spesialis')) rBadgeStaff = 'bg-indigo-100 text-indigo-800 border-indigo-300';
          else if (rLow.includes('dokter')) rBadgeStaff = 'bg-sky-100 text-sky-800 border-sky-300';
          else if (rLow.includes('perawat gigi')) rBadgeStaff = 'bg-teal-100 text-teal-800 border-teal-300';
          else if (rLow.includes('perawat')) rBadgeStaff = 'bg-emerald-100 text-emerald-800 border-emerald-300';
          else if (rLow.includes('office')) rBadgeStaff = 'bg-rose-100 text-rose-800 border-rose-300';
          else if (rLow.includes('admin') || rLow.includes('kasir')) rBadgeStaff = 'bg-amber-100 text-amber-900 border-amber-300';
          return `
            <tr class="hover:bg-cyan-50/40 transition-colors">
              <td class="py-3 px-4">
                <div class="font-mono font-black text-cyan-700 text-[11px]">${s.idPayrollStaff}</div>
                <div class="text-[10px] font-bold text-slate-500">${s.periodeBulan}</div>
              </td>
              <td class="py-3 px-4">
                <div class="font-black text-slate-800">${s.namaStaff}</div>
                <div class="text-[10px] text-slate-500">${s.catatan || ''}</div>
              </td>
              <td class="py-3 px-3">

  function handleTarifNamaPekerjaChange() {
    const namaInput = document.getElementById('tarifNamaPekerja');
    const roleInput = document.getElementById('tarifRole');
    const hint = document.getElementById('tarifNamaHint');
    if (!namaInput || !roleInput) return;

    const val = namaInput.value.trim();
    if (!val) {
      roleInput.value = '';
      if (hint) { hint.textContent = 'Nama harus sesuai dengan yang ada di Master User & Role'; hint.className = 'text-[10px] text-slate-500 mt-1'; }
      return;
    }

    const staffList = (window.KlinikData && Array.isArray(window.KlinikData.staff)) ? window.KlinikData.staff : [];
    const found = staffList.find(s => (s.nama || '').trim().toLowerCase() === val.toLowerCase());

    if (found) {
      roleInput.value = found.role || 'Admin';
      if (hint) {
        hint.textContent = '✓ Terverifikasi di Sheet Data (' + found.role + ')';
        hint.className = 'text-[10px] text-emerald-600 font-bold mt-1';
      }
      const exTarif = (window.PayrollState.tarifShift || []).find(x => String(x.namaPekerja || '').toLowerCase() === val.toLowerCase());
      const isDokterNama = (found.role || '').toLowerCase().includes('dokter');
      const wrapJMNama = document.getElementById('wrapperTarifPersenJM');
      const inpJMNama = document.getElementById('tarifPersenJM');
      if (wrapJMNama) {
        if (isDokterNama) wrapJMNama.classList.remove('hidden');
        else wrapJMNama.classList.add('hidden');
      }
      if (isDokterNama && inpJMNama) {
        let p = (exTarif && exTarif.persenJM !== undefined && exTarif.persenJM !== null && exTarif.persenJM !== '')
          ? Number(exTarif.persenJM)
          : ((found.persenJM !== undefined && found.persenJM !== null && found.persenJM !== '') ? Number(found.persenJM) : 0);
        if (p <= 1 && p > 0) p = Math.round(p * 100);
        inpJMNama.value = p;
      }
      const tipeEl = document.getElementById('tarifTipe');
      if (tipeEl) {
        if (exTarif && exTarif.tipeKompensasi) {
          tipeEl.value = exTarif.tipeKompensasi;
          handleTarifTipeChange();
          if (exTarif.tipeKompensasi === 'Uang Harian Shift' || exTarif.tipeKompensasi === 'Kombinasi Shift & Tindakan') {
            let s1El = document.getElementById('tarifShift1'); if (s1El) s1El.value = Number(exTarif.tarifShift1) || 0;
            let s2El = document.getElementById('tarifShift2'); if (s2El) s2El.value = Number(exTarif.tarifShift2) || 0;
          }
          if (exTarif.tipeKompensasi === 'Gaji Bulanan Tetap') {
            let gpEl = document.getElementById('tarifGajiPokok'); if (gpEl) gpEl.value = Number(exTarif.gajiPokokBulanan) || 0;
          }
        } else {
          if (!tipeEl.value) {
            tipeEl.value = '';
            handleTarifTipeChange();
          }
        }
      }
    } else {
      roleInput.value = '';
      const wrapJMNama = document.getElementById('wrapperTarifPersenJM');
      if (wrapJMNama) wrapJMNama.classList.add('hidden');
      if (hint) {
        hint.textContent = '⚠️ Nama tidak terdaftar di Sheet Data. Pendaftaran akan ditolak!';
        hint.className = 'text-[10px] text-rose-600 font-bold mt-1';
      }
    }
  }

  function handleTarifTipeChange() {
    const tipeEl = document.getElementById('tarifTipe');
    const tipe = (tipeEl ? tipeEl.value : '').trim();
    const s1 = document.getElementById('tarifShift1');
    const s2 = document.getElementById('tarifShift2');
    const gp = document.getElementById('tarifGajiPokok');
    const roleVal = ((document.getElementById('tarifRole') || {}).value || '').toLowerCase();
    const wrapJM = document.getElementById('wrapperTarifPersenJM');
    const inpJM = document.getElementById('tarifPersenJM');
    const isDokterTipe = roleVal.includes('dokter') || tipe === 'Tindakan' || tipe === 'Kombinasi Shift & Tindakan';
    if (wrapJM) {
      if (isDokterTipe) wrapJM.classList.remove('hidden');
      else wrapJM.classList.add('hidden');
    }
    if (isDokterTipe && inpJM && (!inpJM.value || inpJM.value === '')) {
      inpJM.value = 0;
    }

    if (!s1 || !s2 || !gp) return;

    const setInputState = (inputEl, isEnabled, defaultVal = 0) => {
      inputEl.disabled = !isEnabled;
      if (!isEnabled) {
        inputEl.value = defaultVal;
        inputEl.classList.remove('bg-slate-50', 'text-slate-800', 'border-slate-300');
        inputEl.classList.add('bg-slate-100', 'text-slate-400', 'border-slate-200', 'cursor-not-allowed');
      } else {
        inputEl.classList.remove('bg-slate-100', 'text-slate-400', 'border-slate-200', 'cursor-not-allowed');
        inputEl.classList.add('bg-slate-50', 'text-slate-800', 'border-slate-300');
        if (inputEl.value === '' || inputEl.value === '0') {
          if (defaultVal > 0) inputEl.value = defaultVal;
        }
      }
    };

    if (tipe === 'Tindakan') {
      // jika ini di pilih maka Tarif shift 1 dan 2, gaji pokok tidak bisa di isi.
      setInputState(s1, false, 0);
      setInputState(s2, false, 0);
      setInputState(gp, false, 0);
    } else if (tipe === 'Uang Harian Shift') {
      // Jika di pilih Uang Harian Shift, Gaji pokok Bulanan tidka Bisa di isi.
      setInputState(s1, true, 45000);
      setInputState(s2, true, 45000);
      setInputState(gp, false, 0);
    } else if (tipe === 'Gaji Bulanan Tetap') {
      // Jika Gaji Bulanan Tetap. Tarif shift tidak bisa di isi.
      setInputState(s1, false, 0);
      setInputState(s2, false, 0);
      setInputState(gp, true, 1200000);
    } else if (tipe === 'Kombinasi Shift & Tindakan') {
      // Jika Kombinasi Shift & Tindakan, Gaji pokok tidak bisa di isi.
      setInputState(s1, true, 55000);
      setInputState(s2, true, 55000);
      setInputState(gp, false, 0);
    } else {
      // default kosong: semua tidak bisa diisi sampai memilih tipe kompensasi
      setInputState(s1, false, 0);
      setInputState(s2, false, 0);
      setInputState(gp, false, 0);
    }
  }

  function toggleFormTarifShift(show, isEdit) {
    const card = document.getElementById('cardFormTarifShift');
    if (!card) return;
    const shouldShow = (show !== undefined) ? !!show : card.classList.contains('hidden');
    if (shouldShow) {
      card.classList.remove('hidden');
      if (!isEdit) {
        resetFormTarifShiftBaru();
      }
      if (typeof card.scrollIntoView === 'function') {
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    } else {
      card.classList.add('hidden');
    }
  }

  function pilihTarifShiftToEdit(idx) {
    const card = document.getElementById('cardFormTarifShift');
    if (card) card.classList.remove('hidden');
    const item = (window.PayrollState.tarifShift || [])[idx];
    if (!item) return;
    document.getElementById('tarifNamaPekerja').value = item.namaPekerja || '';

      tipeEl.value = item.tipeKompensasi || '';

      document.getElementById('tarifShift1').value = Number(item.tarifShift1) || 0;
      document.getElementById('tarifShift2').value = Number(item.tarifShift2) || 0;
    } else {
      document.getElementById('tarifShift1').value = 0;
      document.getElementById('tarifShift2').value = 0;
    }
    if (item.tipeKompensasi === 'Gaji Bulanan Tetap') {
      document.getElementById('tarifGajiPokok').value = Number(item.gajiPokokBulanan) || 0;

      document.getElementById('tarifGajiPokok').value = 0;

  function handleSimpanTarifShift(e) {
    if (e) e.preventDefault();
    const namaPekerja = ((document.getElementById('tarifNamaPekerja') || {}).value || '').trim();
    if (!namaPekerja) {
      if (typeof showToast === 'function') showToast('error', 'Nama pekerja wajib diisi!');
      return;
    }

    const tipeKompensasi = ((document.getElementById('tarifTipe') || {}).value || '').trim();
    if (!tipeKompensasi) {
      if (typeof showToast === 'function') showToast('error', 'Silakan pilih Tipe Kompensasi terlebih dahulu!');
      const elTipe = document.getElementById('tarifTipe');
      if (elTipe) elTipe.focus();
      return;
    }

    // 1. Validasi: Nama harus sudah terdaftar di Sheet Data. Jika namanya tidak ada di sheet data, TOLAK!
    const staffList = (window.KlinikData && Array.isArray(window.KlinikData.staff)) ? window.KlinikData.staff : [];
    let foundStaff = null;
    if (staffList.length > 0) {
      foundStaff = staffList.find(s => (s.nama || '').trim().toLowerCase() === namaPekerja.toLowerCase());
      if (!foundStaff) {
        if (typeof showToast === 'function') {
          showToast('error', 'Nama [' + namaPekerja + '] belum terdaftar di Sheet Data. Pendaftaran ditolak! Silakan daftarkan pekerja di Master User terlebih dahulu.');
        }
        return;
      }
    }

    // 2. Masukkan secara otomatis Role dari Nama Pekerja (dari Sheet Data)
    const autoRole = foundStaff ? foundStaff.role : ((document.getElementById('tarifRole') || {}).value || 'Admin');

    // 3. Isi ID_Pekerja / ID_Aturan secara otomatis berdasarkan Role atau Sheet Data
    let exTarif = (window.PayrollState.tarifShift || []).find(x => String(x.namaPekerja || '').toLowerCase() === namaPekerja.toLowerCase());
    let idAturan = exTarif ? (exTarif.idPekerja || exTarif.idAturan) : '';
    if (!idAturan && foundStaff) {
      idAturan = foundStaff.idPekerja || foundStaff.id;
    }
    if (!idAturan) {
      let pfx = 'SN-';
      let maxN = 0;
      (window.PayrollState.tarifShift || []).forEach(t => {
        let tid = String(t.idPekerja || t.idAturan || '');
        if (tid.toUpperCase().startsWith(pfx)) {
          let numPart = parseInt(tid.substring(pfx.length), 10);
          if (!isNaN(numPart) && numPart > maxN) maxN = numPart;
        }
      });
      idAturan = pfx + String(maxN + 1).padStart(2, '0');
    }

    // Terapkan batas nilai sesuai Tipe Kompensasi terpilih
    let s1Val = (tipeKompensasi === 'Uang Harian Shift' || tipeKompensasi === 'Kombinasi Shift & Tindakan')
      ? (Number((document.getElementById('tarifShift1') || {}).value) || 0)
      : 0;
    let s2Val = (tipeKompensasi === 'Uang Harian Shift' || tipeKompensasi === 'Kombinasi Shift & Tindakan')
      ? (Number((document.getElementById('tarifShift2') || {}).value) || 0)
      : 0;
    let gpVal = (tipeKompensasi === 'Gaji Bulanan Tetap')
      ? (Number((document.getElementById('tarifGajiPokok') || {}).value) || 0)
      : 0;

    const isDokterSave = autoRole.toLowerCase().includes('dokter') || tipeKompensasi === 'Tindakan' || tipeKompensasi === 'Kombinasi Shift & Tindakan';
    let pjmVal = 0;
    if (isDokterSave) {
      const inpJM = document.getElementById('tarifPersenJM');
      const rawVal = inpJM ? inpJM.value.trim() : '';
      pjmVal = (rawVal !== '' && !isNaN(Number(rawVal))) ? Number(rawVal) : 0;
    }

    const payload = {
      idAturan: idAturan,
      idPekerja: idAturan,
      namaPekerja: foundStaff ? foundStaff.nama : namaPekerja,
      role: autoRole,
      tipeKompensasi: tipeKompensasi,
      tarifShift1: s1Val,
      tarifShift2: s2Val,
      gajiPokokBulanan: gpVal,
      persenJM: pjmVal,
      keterangan: ((document.getElementById('tarifKeterangan') || {}).value || '').trim(),
      status: (document.getElementById('tarifStatus') || {}).value || 'Aktif'
    };

    if (foundStaff && isDokterSave) {
      foundStaff.persenJM = pjmVal > 1 ? (pjmVal / 100) : pjmVal;
    }

    let exIdx = (window.PayrollState.tarifShift || []).findIndex(x => String(x.namaPekerja || '').toLowerCase() === payload.namaPekerja.toLowerCase());
    if (exIdx >= 0) {
      window.PayrollState.tarifShift[exIdx] = Object.assign(window.PayrollState.tarifShift[exIdx], payload);
    } else {
      window.PayrollState.tarifShift.push(payload);
    }
    savePayrollCacheLocal();
    renderAllPayrollTables();

    const btn = document.getElementById('btnSubmitTarifShift');
    const orig = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.innerHTML = '⏳ MENYIMPAN...'; }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (btn) { btn.disabled = false; btn.innerHTML = orig; }
          if (res && res.success) {
            if (typeof showToast === 'function') showToast('success', res.message || 'Aturan tarif shift disimpan!');
          } else {
            if (typeof showToast === 'function') showToast('error', (res && res.message) ? res.message : 'Gagal menyimpan aturan tarif shift.');
          }
        })
        .withFailureHandler(err => {
          if (btn) { btn.disabled = false; btn.innerHTML = orig; }
          if (typeof showToast === 'function') showToast('error', 'Gagal menyimpan: ' + (err.message || err));
        })
        .simpanTarifShift(payload);
    } else {
      if (btn) { btn.disabled = false; btn.innerHTML = orig; }
      if (typeof showToast === 'function') showToast('success', 'Aturan tarif shift & gaji untuk ' + payload.namaPekerja + ' (' + idAturan + ') berhasil disimpan!');
    }
  }

  function togglePayrollPaidStatus(kategori, idx) {
    const list = kategori === 'staff' ? window.PayrollState.honorStaff : window.PayrollState.penggajianDokter;
    const item = (list || [])[idx];
    if (!item) return;

    const nextStatus = item.statusTransfer === 'Paid' ? 'Draft' : 'Paid';
    item.statusTransfer = nextStatus;
    savePayrollCacheLocal();
    renderAllPayrollTables();

    const idPayroll = kategori === 'staff' ? item.idPayrollStaff : item.idPayroll;
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (typeof showToast === 'function') showToast('success', (res && res.message) ? res.message : ('Status diubah menjadi ' + nextStatus));
        })
        .updateStatusPayroll({ kategori: kategori, idPayroll: idPayroll, statusTransfer: nextStatus });
    } else {
      if (typeof showToast === 'function') showToast('success', 'Status Payroll [' + idPayroll + '] diubah menjadi ' + nextStatus);
    }
  }

  function triggerGeneratePayrollPeriode() {
    const periode = (document.getElementById('payrollPeriodeInput') || {}).value || 'Oktober 2026';
    const btn = document.getElementById('btnGeneratePayrollView');
    const orig = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.innerHTML = '⏳ MENGHITUNG PAYROLL...'; }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (btn) { btn.disabled = false; btn.innerHTML = orig; }
          if (res && res.success) {
            if (typeof showToast === 'function') showToast('success', res.message);
            loadPayrollModuleData(false);
          } else {
            recalculateShiftTotalsFromPresensi();
            renderAllPayrollTables();
            if (typeof showToast === 'function') showToast('info', (res && res.message) ? res.message : 'Perhitungan Payroll diperbarui.');
          }
        })
        .withFailureHandler(() => {
          if (btn) { btn.disabled = false; btn.innerHTML = orig; }
          recalculateShiftTotalsFromPresensi();
          renderAllPayrollTables();
          if (typeof showToast === 'function') showToast('success', 'Rekap Payroll periode ' + periode + ' berhasil dihitung!');
        })
        .generatePayrollPeriode(periode);
    } else {
      if (btn) { btn.disabled = false; btn.innerHTML = orig; }
      recalculateShiftTotalsFromPresensi();
      renderAllPayrollTables();
      if (typeof showToast === 'function') showToast('success', 'Rekap Payroll periode ' + periode + ' berhasil dihitung!');
    }
  }

  function closeSlipGajiModal() {
    const modal = document.getElementById('slipGajiModal');
    if (modal) modal.classList.add('hidden');
  }

  function downloadSlipGajiPDF() {
    const el = document.getElementById('slipGajiPrintableArea');
    if (!el) return;
    if (typeof html2pdf !== 'undefined') {
      html2pdf().set({
        margin: 10,
        filename: 'Slip_Payroll_Sheldon_' + Date.now() + '.pdf',
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a5', orientation: 'landscape' }
      }).from(el).save();
    } else {
      window.print();
    }
  }
